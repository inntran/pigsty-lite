---
# Testing goal: verify the vip_manager role's disabled path — the
# package installs unconditionally, but no config is rendered and the
# service stays inactive when vip_manager_enabled=false. Avoids needing
# a routable VIP in the test network.
driver:
  name: podman
platforms:
  - name: pigsty-lite-vipmgr
    image: localhost/molecule-base-data:latest
    pre_build_image: true
    privileged: true
    command: /usr/sbin/init
    volume_mounts:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
    capabilities: [SYS_ADMIN]
    security_opts: ["label=disable"]
    systemd: always
    groups: [etcd, postgres]
    network: pigsty-lite-vipmgr-default
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        network_ip_version: ipv4
        cluster_name: pigsty-lite-test
        pigsty_pki_dir: /etc/pki/pigsty
        postgres_version: 18
      etcd:
        etcd_initial_cluster_state: new
    host_vars:
      pigsty-lite-vipmgr:
        postgres_role: primary
        etcd_seq: 1
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
