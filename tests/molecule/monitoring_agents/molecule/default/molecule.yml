---
# Testing goal: verify the monitoring_agents role installs node/pg/pgbouncer/
# pgbackrest exporters + vmagent + vlagent on a fully-stacked postgres node
# and that the monitor host receives metrics/logs. Prepare imports the full
# base stack (etcd + patroni + pgbouncer + haproxy + pgbackrest + monitoring
# server) so every exporter has a real target to scrape.
driver:
  name: podman
platforms:
  - name: pigsty-lite-monagt-default-server
    image: localhost/molecule-base-data:latest
    pre_build_image: true
    privileged: true
    command: /usr/sbin/init
    volume_mounts:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
    capabilities: [SYS_ADMIN]
    security_opts: ["label=disable"]
    systemd: always
    groups: [monitor, backup_server]
    network: pigsty-lite-monagt-default
  - name: pigsty-lite-monagt-default-2
    image: localhost/molecule-base-data:latest
    pre_build_image: true
    privileged: true
    command: /usr/sbin/init
    volume_mounts:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
    capabilities: [SYS_ADMIN]
    security_opts: ["label=disable"]
    systemd: always
    groups: [postgres]
    network: pigsty-lite-monagt-default
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        cluster_name: pigsty-lite-test
        cluster_domain: test.local
        pigsty_pki_dir: /etc/pki/pigsty
        node_sysctl_apply: false
        postgres_version: 18
    host_vars:
      pigsty-lite-monagt-default-server: {}
      pigsty-lite-monagt-default-2:
        postgres_role: primary
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
