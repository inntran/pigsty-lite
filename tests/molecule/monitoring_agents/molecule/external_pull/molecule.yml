---
# Testing goal: verify external_pull installs the nginx metrics frontend
# without a monitor host, requires basic auth, and serves exporter metrics.
driver:
  name: podman
platforms:
  - name: pigsty-lite-monagt-pull
    image: localhost/molecule-base-data:latest
    pre_build_image: true
    privileged: true
    command: /usr/sbin/init
    volume_mounts:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
    capabilities: [SYS_ADMIN]
    security_opts: ["label=disable"]
    systemd: always
    groups: [external_pull]
    network: pigsty-lite-monagt-pull
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        network_ip_version: ipv4
        cluster_name: pigsty-lite-test
        cluster_domain: test.local
        pigsty_pki_dir: /etc/pki/pigsty
        node_sysctl_apply: false
        repos_epel_enabled: true
        postgres_version: 18
        monitoring_mode: external_pull
        monitoring_pull_metrics_port: 9965
        monitoring_pull_auth_username: pigsty
        monitoring_pull_source_cidrs: ["127.0.0.1/32", "10.0.0.0/8"]
        monitoring_pull_tls: false
        monitoring_agents_node_exporter_package: node-exporter
        vault_monitoring_pull_password: pull-test-pw
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
