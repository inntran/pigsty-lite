---
# Testing goal: verify external_pull installs the exporter_exporter endpoint
# without a monitor host, requires the bearer token over TLS, and proxies
# exporter metrics.
driver:
  name: podman
platforms:
  - name: pigsty-lite-monagt-pull
    image: localhost/molecule-base-data:latest
    pre_build_image: true
    privileged: true
    command: /usr/sbin/init
    volumes:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
    capabilities: [SYS_ADMIN]
    security_opts: ["label=disable"]
    systemd: always
    groups: [external_pull]
    network: pigsty-lite-monagt-pull
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        network_ip_version: ipv4
        cluster_name: pigsty-lite-test
        cluster_domain: test.local
        pigsty_pki_dir: /etc/pki/pigsty
        node_sysctl_apply: false
        postgres_version: 18
        monitoring_mode: external_pull
        monitoring_pull_metrics_port: 9999
        monitoring_pull_source_cidrs: ["127.0.0.1/32", "10.0.0.0/8"]
        monitoring_pull_tls: true
        vault_monitoring_pull_token: pull-test-token
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
