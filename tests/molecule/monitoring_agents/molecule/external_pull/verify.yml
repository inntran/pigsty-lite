---
- name: Verify external pull metrics frontend
  hosts: all
  ignore_errors: "{{ lookup('ansible.builtin.env', 'MOLECULE_TASK_IGNORE_ERRORS') | default('', true) | bool }}"
  become: true
  gather_facts: false
  tasks:
    - name: Check exporter_exporter rejects requests without the bearer token
      ansible.builtin.uri:
        url: "https://127.0.0.1:9999/proxy?module=node"
        method: GET
        validate_certs: false
        status_code: [401]

    - name: Check exporter_exporter rejects a wrong bearer token
      ansible.builtin.uri:
        url: "https://127.0.0.1:9999/proxy?module=node"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer wrong"
        status_code: [401]

    - name: Check exporter_exporter serves node metrics with the bearer token
      ansible.builtin.uri:
        url: "https://127.0.0.1:9999/proxy?module=node"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer pull-test-token"
        status_code: [200]
        return_content: true
      register: node_metrics
      retries: 10
      delay: 3
      until: node_metrics.status == 200

    - name: Assert node metrics came through the path-routed frontend
      ansible.builtin.assert:
        that:
          - "'node_exporter_build_info' in node_metrics.content"
        fail_msg: "exporter_exporter did not return node_exporter metrics"

    - name: Check exporter_exporter refuses modules it does not proxy
      ansible.builtin.uri:
        url: "https://127.0.0.1:9999/proxy?module=nope"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer pull-test-token"
        status_code: [404]

    - name: Check plain HTTP is refused on the TLS endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:9999/proxy?module=node"
        method: GET
        status_code: [400]

    - name: Check the bearer token is not on the exporter_exporter command line
      ansible.builtin.command:
        cmd: pgrep -a -f /usr/bin/exporter_exporter
      register: exporter_exporter_cmdline
      changed_when: false

    - name: Assert the bearer token is kept off the command line
      ansible.builtin.assert:
        that:
          - "'pull-test-token' not in exporter_exporter_cmdline.stdout"
          - "'-web.bearer.token-file' in exporter_exporter_cmdline.stdout"
        fail_msg: "exporter_exporter command line leaked the bearer token or dropped the token-file flag"

    - name: Check the token file is group-readable by exporter_exporter only
      ansible.builtin.stat:
        path: /etc/pigsty/monitoring/exporter_exporter.token
      register: exporter_exporter_token_file

    - name: Assert the token file permissions and ownership are locked down
      ansible.builtin.assert:
        that:
          - exporter_exporter_token_file.stat.mode == "0640"
          - exporter_exporter_token_file.stat.pw_name == "root"
          - exporter_exporter_token_file.stat.gr_name == "exporter_exporter"
        fail_msg: "exporter_exporter token file is not locked down to root:exporter_exporter 0640"

    - name: Check vmagent is not listening in external_pull mode
      ansible.builtin.command:
        cmd: "ss -H -ltn sport = :8429"
      register: vmagent_listen
      changed_when: false
      failed_when: vmagent_listen.stdout | length > 0
