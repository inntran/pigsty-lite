---
- name: Install bootstrap tooling
  hosts: all
  gather_facts: false
  tasks:
    - name: Ensure bootstrap packages are present
      ansible.builtin.dnf:
        name:
          - iproute
          - sudo
        state: present

    - name: Ensure pigsty group exists
      ansible.builtin.group:
        name: pigsty
        gid: 926
        system: true

    - name: Ensure pigsty user exists
      ansible.builtin.user:
        name: pigsty
        uid: 926
        group: pigsty
        system: true
        home: /var/lib/pigsty
        shell: /sbin/nologin
        comment: pigsty-lite shared identity

    - name: Install NOPASSWD sudoers drop-ins
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ item.name }}"
        content: "{{ item.content }}\n"
        owner: root
        group: root
        mode: "0440"
      loop:
        - { name: wheel-nopasswd, content: "%wheel ALL=(ALL) NOPASSWD: ALL" }
        - { name: all-nopasswd, content: "ALL ALL=(ALL) NOPASSWD: ALL" }

- name: Prepare - generate CA on control side
  hosts: localhost
  gather_facts: false
  roles:
    - role: ca

- name: Prepare - repos, node, certs, etcd, postgres, patroni
  hosts: all
  gather_facts: true
  vars:
    repos_pgdg_enabled: true
    repos_pgdg_rpm_url: "https://download.postgresql.org/pub/repos/yum/reporpms/EL-10-x86_64/pgdg-redhat-repo-latest.noarch.rpm"
    network_any_address: 0.0.0.0
    network_loopback_address: 127.0.0.1
    firewalld_default_zone: public
    node_sysctl_apply: false
  pre_tasks:
    - name: Pin advertise addresses and SANs to container IP
      ansible.builtin.set_fact:
        etcd_advertise_address: "{{ ansible_facts['default_ipv4']['address'] }}"
        patroni_advertise_address: "{{ ansible_facts['default_ipv4']['address'] }}"
  roles:
    - role: repos
    - role: node
    - role: certs
    - role: etcd
    - role: postgres
    - role: patroni
