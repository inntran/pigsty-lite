---
- name: Identify the current Patroni leader
  hosts: postgres
  ignore_errors: "{{ lookup('ansible.builtin.env', 'MOLECULE_TASK_IGNORE_ERRORS') | default('', true) | bool }}"
  become: true
  gather_facts: true
  run_once: true
  tasks:
    - name: GET /cluster
      ansible.builtin.uri:
        url: "https://{{ ansible_facts['default_ipv4']['address'] }}:8008/cluster"
        validate_certs: false
        return_content: true
      register: cluster

    - name: Set leader fact
      ansible.builtin.set_fact:
        leader_host: >-
          {{ (cluster.json.members
              | selectattr('role', 'equalto', 'leader')
              | list | first).name }}

- name: Verify provisioning state propagates to every node
  hosts: postgres
  ignore_errors: "{{ lookup('ansible.builtin.env', 'MOLECULE_TASK_IGNORE_ERRORS') | default('', true) | bool }}"
  become: true
  become_user: postgres
  gather_facts: false
  tasks:
    - name: Role 'app' visible on every host (via streaming replication)
      community.postgresql.postgresql_query:
        query: "SELECT 1 FROM pg_roles WHERE rolname = 'app'"
        login_db: postgres
        login_unix_socket: /var/run/postgresql
      register: q_role
      changed_when: false

    - name: Assert role visible everywhere
      ansible.builtin.assert:
        that:
          - q_role.rowcount == 1
        fail_msg: "Role 'app' not visible on {{ inventory_hostname }}"

    - name: Database 'app' visible on every host
      community.postgresql.postgresql_query:
        query: "SELECT 1 FROM pg_database WHERE datname = 'app'"
        login_db: postgres
        login_unix_socket: /var/run/postgresql
      register: q_db
      changed_when: false

    - name: Assert database visible everywhere
      ansible.builtin.assert:
        that:
          - q_db.rowcount == 1
        fail_msg: "Database 'app' not visible on {{ inventory_hostname }}"

- name: Verify every member has the same, error-free pg_hba with the app rule
  hosts: postgres
  ignore_errors: "{{ lookup('ansible.builtin.env', 'MOLECULE_TASK_IGNORE_ERRORS') | default('', true) | bool }}"
  become: true
  gather_facts: false
  tasks:
    # pg_hba.conf is a file, not replicated data: a rule written only on
    # the leader would be missing on the member promoted after a failover.
    - name: Grep the app rule on this member
      ansible.builtin.command: >-
        grep -E "^hostssl[[:space:]]+app[[:space:]]+app[[:space:]]+0\.0\.0\.0/0"
        /var/lib/pgsql/18/data/pg_hba.conf
      register: hba_grep
      changed_when: false
      failed_when: hba_grep.rc != 0

    - name: Fingerprint pg_hba.conf on this member
      ansible.builtin.command: sha256sum /var/lib/pgsql/18/data/pg_hba.conf
      register: hba_sum
      changed_when: false

    - name: Record this member's fingerprint
      ansible.builtin.set_fact:
        hba_sha: "{{ hba_sum.stdout.split()[0] }}"

    - name: Assert every member has an identical pg_hba.conf
      ansible.builtin.assert:
        that:
          - groups['postgres'] | map('extract', hostvars, 'hba_sha') | unique | length == 1
        fail_msg: >-
          pg_hba.conf differs across members:
          {{ dict(groups['postgres'] | zip(groups['postgres'] | map('extract', hostvars, 'hba_sha'))) }}
      run_once: true

    # The file hash proves convergence on disk; pg_hba_file_rules proves
    # PostgreSQL can parse every line it would load.
    - name: Count pg_hba lines PostgreSQL rejects on this member
      community.postgresql.postgresql_query:
        query: "SELECT count(*) AS bad FROM pg_hba_file_rules WHERE error IS NOT NULL"
        login_unix_socket: /var/run/postgresql
        login_user: postgres
        login_db: postgres
      become: true
      become_user: postgres
      register: hba_errors

    - name: Assert PostgreSQL accepts every pg_hba line
      ansible.builtin.assert:
        that:
          - hba_errors.query_result[0].bad == 0

- name: Probe psql 5433 (HAProxy not in this scenario; use leader directly)
  hosts: postgres
  ignore_errors: "{{ lookup('ansible.builtin.env', 'MOLECULE_TASK_IGNORE_ERRORS') | default('', true) | bool }}"
  become: true
  gather_facts: true
  run_once: true
  tasks:
    - name: Psql as app over TLS to the leader
      ansible.builtin.command: >
        /usr/pgsql-18/bin/psql
        "host={{ hostvars[leader_host].ansible_facts['default_ipv4']['address'] }} dbname=app user=app
         password=app-test-pw sslmode=require"
        -tAc "select 1"
      register: probe
      changed_when: false
      failed_when: probe.rc != 0 or probe.stdout.strip() != "1"
