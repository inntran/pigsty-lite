---
# Testing goal: verify the repos role enables PGDG (and optionally pigsty)
# yum repos and that the postgres server package becomes installable.
driver:
  name: podman
platforms:
  - name: pigsty-lite-repos-rocky10
    image: container-registry.oracle.com/os/oraclelinux:10
    pre_build_image: true
    privileged: true
    command: /usr/sbin/init
    volume_mounts:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
    capabilities: [SYS_ADMIN]
    security_opts: ["label=disable"]
    systemd: always
    network: pigsty-lite-repos-default
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        network_ip_version: ipv4
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - create
    - converge
    - idempotence
    - verify
    - destroy
