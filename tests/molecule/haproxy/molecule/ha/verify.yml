---
- name: Verify haproxy on every host
  hosts: postgres
  ignore_errors: "{{ lookup('ansible.builtin.env', 'MOLECULE_TASK_IGNORE_ERRORS') | default('', true) | bool }}"
  become: true
  tasks:
    - name: Check HAProxy active
      ansible.builtin.systemd:
        name: haproxy
      register: hap_unit

    - name: Assert active
      ansible.builtin.assert:
        that:
          - hap_unit.status.ActiveState == "active"

- name: Identify the current Patroni leader
  hosts: postgres
  ignore_errors: "{{ lookup('ansible.builtin.env', 'MOLECULE_TASK_IGNORE_ERRORS') | default('', true) | bool }}"
  become: true
  run_once: true
  tasks:
    - name: GET /cluster
      ansible.builtin.uri:
        url: "https://{{ ansible_facts['default_ipv4']['address'] }}:8008/cluster"
        validate_certs: false
        return_content: true
      register: pre_cluster

    - name: Extract leader hostname
      ansible.builtin.set_fact:
        leader_host: >-
          {{ (pre_cluster.json.members
              | selectattr('role', 'equalto', 'leader')
              | list | first).name }}

    - name: Print leader
      ansible.builtin.debug:
        msg: "Current leader: {{ leader_host }}"

- name: "Probe HAProxy routing (5433 = leader, 5434 = replica)"
  hosts: postgres
  ignore_errors: "{{ lookup('ansible.builtin.env', 'MOLECULE_TASK_IGNORE_ERRORS') | default('', true) | bool }}"
  become: true
  tasks:
    - name: "Probe psql 5433 \u2192 must hit a primary"
      ansible.builtin.command: >
        /usr/pgsql-18/bin/psql
        "host=127.0.0.2 port=5433 dbname=postgres user=postgres password=superuser-test-pw sslmode=disable"
        -tAc "select inet_server_addr() || ' is_replica=' || pg_is_in_recovery()"
      register: probe_5433
      changed_when: false
      retries: 10
      delay: 3
      until: probe_5433.rc == 0

    - name: Assert 5433 hit a primary
      ansible.builtin.assert:
        that:
          - "'is_replica=f' in probe_5433.stdout or 'is_replica=false' in probe_5433.stdout"
        fail_msg: "5433 routed to a replica. Got: {{ probe_5433.stdout }}"

    - name: "Probe psql 5434 \u2192 must hit a replica"
      ansible.builtin.command: >
        /usr/pgsql-18/bin/psql
        "host=127.0.0.2 port=5434 dbname=postgres user=postgres password=superuser-test-pw sslmode=disable"
        -tAc "select inet_server_addr() || ' is_replica=' || pg_is_in_recovery()"
      register: probe_5434
      changed_when: false
      retries: 10
      delay: 3
      until: probe_5434.rc == 0

    - name: Assert 5434 hit a replica
      ansible.builtin.assert:
        that:
          - "'is_replica=t' in probe_5434.stdout or 'is_replica=true' in probe_5434.stdout"
        fail_msg: "5434 routed to a primary. Got: {{ probe_5434.stdout }}"

- name: Switchover and re-probe
  hosts: postgres
  ignore_errors: "{{ lookup('ansible.builtin.env', 'MOLECULE_TASK_IGNORE_ERRORS') | default('', true) | bool }}"
  become: true
  run_once: true
  tasks:
    - name: "Pick a switchover candidate (any non-leader replica)"
      ansible.builtin.set_fact:
        candidate_host: >-
          {{ (pre_cluster.json.members
              | selectattr('role', 'equalto', 'replica')
              | list | first).name }}

    - name: Run patronictl switchover
      ansible.builtin.command: >
        patronictl -c /etc/patroni/patroni.yml switchover
        --leader {{ leader_host }} --candidate {{ candidate_host }}
        --force
      become: true
      become_user: postgres
      changed_when: true
      register: switchover

    - name: Wait for new leader to be {{ candidate_host }}
      ansible.builtin.uri:
        url: "https://{{ ansible_facts['default_ipv4']['address'] }}:8008/cluster"
        validate_certs: false
        return_content: true
      register: post_cluster
      retries: 30
      delay: 2
      until: >-
        (post_cluster.json.members
         | selectattr('role', 'equalto', 'leader')
         | map(attribute='name') | list | first) == candidate_host

    - name: Update leader hostname after switchover
      ansible.builtin.set_fact:
        leader_host: "{{ candidate_host }}"

- name: 5433 follows the new leader
  hosts: postgres
  ignore_errors: "{{ lookup('ansible.builtin.env', 'MOLECULE_TASK_IGNORE_ERRORS') | default('', true) | bool }}"
  become: true
  tasks:
    - name: Probe psql 5433 after switchover
      ansible.builtin.command: >
        /usr/pgsql-18/bin/psql
        "host=127.0.0.2 port=5433 dbname=postgres user=postgres password=superuser-test-pw sslmode=disable"
        -tAc "select pg_is_in_recovery()"
      register: post_probe_5433
      changed_when: false
      retries: 30
      delay: 2
      until: post_probe_5433.rc == 0 and post_probe_5433.stdout.strip() in ['f', 'false']

    - name: Assert 5433 still hits a primary after switchover
      ansible.builtin.assert:
        that:
          - post_probe_5433.stdout.strip() in ['f', 'false']

- name: VIP (vip-manager) routes to the current leader via haproxy 5433
  hosts: postgres
  ignore_errors: "{{ lookup('ansible.builtin.env', 'MOLECULE_TASK_IGNORE_ERRORS') | default('', true) | bool }}"
  become: true
  run_once: true
  tasks:
    - name: Compute VIP address (strip /prefix)
      ansible.builtin.set_fact:
        cluster_vip: "{{ (ansible_facts.default_ipv4.address.rsplit('.', 1)[0]) }}.100"

    - name: Probe psql 5433 via VIP - must hit a primary
      ansible.builtin.command: >
        /usr/pgsql-18/bin/psql
        "host={{ cluster_vip }} port=5433 dbname=postgres user=postgres password=superuser-test-pw sslmode=disable"
        -tAc "select pg_is_in_recovery()"
      register: vip_probe_5433
      changed_when: false
      retries: 30
      delay: 2
      until: vip_probe_5433.rc == 0 and vip_probe_5433.stdout.strip() in ['f', 'false']

    - name: Assert VIP routes to a primary
      ansible.builtin.assert:
        that:
          - vip_probe_5433.stdout.strip() in ['f', 'false']
        fail_msg: "VIP {{ cluster_vip }}:5433 did not reach a primary. Got: {{ vip_probe_5433.stdout }}"

- name: Assert no PostgreSQL member has a trust rule
  hosts: postgres
  ignore_errors: "{{ lookup('ansible.builtin.env', 'MOLECULE_TASK_IGNORE_ERRORS') | default('', true) | bool }}"
  become: true
  tasks:
    - name: Count trust rules in pg_hba.conf
      ansible.builtin.command:
        argv:
          - grep
          - -cE
          - '\strust$'
          - /var/lib/pgsql/18/data/pg_hba.conf
      register: trust_rule_count
      changed_when: false
      failed_when: trust_rule_count.rc not in [0, 1]

    - name: Assert pg_hba.conf has no trust rules
      ansible.builtin.assert:
        that:
          - trust_rule_count.stdout | int == 0
        fail_msg: "{{ inventory_hostname }} has trust rules in pg_hba.conf"

- name: Verify pooled and direct loopback password access
  hosts: postgres
  ignore_errors: "{{ lookup('ansible.builtin.env', 'MOLECULE_TASK_IGNORE_ERRORS') | default('', true) | bool }}"
  become: true
  tasks:
    - name: Create pooled probe role over the Unix socket
      ansible.builtin.command:
        argv:
          - /usr/pgsql-18/bin/psql
          - -d
          - postgres
          - -c
          - >-
            DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'pooled_probe') THEN
            CREATE ROLE pooled_probe LOGIN PASSWORD 'pooled-probe-pw';
            END IF;
            END $$;
      register: create_probe_role
      changed_when: false
      become: true
      become_user: postgres
      run_once: true
      delegate_to: "{{ leader_host }}"

    - name: Connect pooled probe through HAProxy and pgBouncer
      ansible.builtin.command: >
        /usr/pgsql-18/bin/psql
        "host=127.0.0.2 port=5433 dbname=postgres user=pooled_probe password=pooled-probe-pw sslmode=disable"
        -tAc "select current_user"
      register: pooled_probe
      changed_when: false
      retries: 10
      delay: 3
      until: pooled_probe.rc == 0
      run_once: true
      delegate_to: "{{ leader_host }}"

    - name: Assert pooled probe connected as pooled_probe
      ansible.builtin.assert:
        that:
          - pooled_probe.stdout == "pooled_probe"
      run_once: true
      delegate_to: "{{ leader_host }}"

    - name: Connect pooled probe directly over loopback
      ansible.builtin.command: >
        /usr/pgsql-18/bin/psql
        "host=127.0.0.1 port=5432 dbname=postgres user=pooled_probe password=pooled-probe-pw sslmode=disable"
        -tAc "select current_user"
      register: direct_probe
      changed_when: false
      run_once: true
      delegate_to: "{{ leader_host }}"

    - name: Assert direct probe connected as pooled_probe
      ansible.builtin.assert:
        that:
          - direct_probe.stdout == "pooled_probe"
      run_once: true
      delegate_to: "{{ leader_host }}"

    - name: Drop pooled probe role over the Unix socket
      ansible.builtin.command:
        argv:
          - /usr/pgsql-18/bin/psql
          - -d
          - postgres
          - -c
          - DROP ROLE IF EXISTS pooled_probe
      register: drop_probe_role
      changed_when: false
      become: true
      become_user: postgres
      run_once: true
      delegate_to: "{{ leader_host }}"
