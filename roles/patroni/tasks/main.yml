---
- name: Validate preconditions
  ansible.builtin.import_tasks: _assert.yml
  tags: [patroni, assert]

- name: Install Patroni and DCS client
  ansible.builtin.dnf:
    name: "{{ patroni_packages }}"
    state: present
    enablerepo: "{{ epel_repo_id }}"
  tags: [patroni, install]

- name: Ensure postgres user can read shared PKI via the pigsty group
  ansible.builtin.user:
    name: "{{ patroni_postgres_user }}"
    groups: pigsty
    append: true
  tags: [patroni, install]

- name: Ensure patroni log dir exists
  ansible.builtin.file:
    path: "{{ patroni_log_dir }}"
    state: directory
    owner: "{{ patroni_postgres_user }}"
    group: "{{ patroni_postgres_group }}"
    mode: "0750"
  tags: [patroni, install]

- name: Ensure patroni config dir exists
  ansible.builtin.file:
    path: "{{ patroni_config_dir }}"
    state: directory
    owner: root
    group: "{{ patroni_postgres_group }}"
    mode: "0750"
  tags: [patroni, install]

- name: Configure Patroni
  ansible.builtin.import_tasks: _configure.yml
  tags: [patroni, config]

- name: Install custom patroni-rest firewalld service
  ansible.builtin.copy:
    src: "patroni-rest.xml"
    dest: /etc/firewalld/services/patroni-rest.xml
    owner: root
    group: root
    mode: "0644"
  register: patroni_fw_svc
  tags: [patroni, firewall]

- name: Reload firewalld if patroni-rest definition changed  # noqa: no-handler
  ansible.builtin.command: firewall-cmd --reload
  when: patroni_fw_svc.changed
  changed_when: true
  tags: [patroni, firewall]

- name: Open patroni-rest in default zone
  ansible.posix.firewalld:
    service: "{{ patroni_firewalld_service_name }}"
    permanent: true
    state: enabled
    immediate: true
    zone: "{{ patroni_firewalld_zone }}"
  when: groups['postgres'] | length > 1
  tags: [patroni, firewall]

# The rule's family must match the peer's address: firewalld never matches an
# IPv4 rule against an IPv6 source. Each lookup step is guarded with
# `is defined`, so a missing ansible_host (e.g. molecule inventories) falls
# through to the peer's gathered facts instead of failing eagerly. Peers
# outside --limit still resolve via inventory (ansible_host).
- name: Resolve each postgres peer's address for its firewall rule
  ansible.builtin.set_fact:
    patroni_peer_addresses: >-
      {{ patroni_peer_addresses | default({}) | combine({item: (
           hostvars[item].patroni_advertise_address
             if hostvars[item].patroni_advertise_address is defined
           else hostvars[item].ansible_host
             if hostvars[item].ansible_host is defined
           else ((hostvars[item].ansible_facts | default({}))
                  .get('default_ipv6' if (network_ipv6_single_stack | default(false) | bool) else 'default_ipv4', {})
                  .get('address'))
         ) | default('', true) | string}) }}
  loop: "{{ groups['postgres'] | difference([inventory_hostname]) }}"
  tags: [patroni, firewall]

- name: Fail if a postgres peer has no address
  ansible.builtin.assert:
    that:
      - patroni_peer_addresses | dict2items | selectattr('value', 'equalto', '') | list | length == 0
    fail_msg: >-
      No address for postgres peer(s)
      {{ patroni_peer_addresses | dict2items | selectattr('value', 'equalto', '') | map(attribute='key') | join(', ') }}:
      set ansible_host or patroni_advertise_address for them, or gather their facts in this run.
  when: patroni_peer_addresses is defined
  tags: [patroni, firewall]

- name: Open PostgreSQL port to other cluster members (replication + pg_basebackup)
  ansible.posix.firewalld:
    rich_rule: >-
      rule family='{{ 'ipv6' if ':' in item.value else 'ipv4' }}'
      source address='{{ item.value }}'
      service name='postgresql'
      accept
    permanent: true
    state: enabled
    immediate: true
    zone: "{{ patroni_firewalld_zone }}"
  loop: "{{ patroni_peer_addresses | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }} {{ item.value }}"
  tags: [patroni, firewall]

- name: Start Patroni and wait for healthy cluster
  ansible.builtin.import_tasks: _service.yml
  tags: [patroni, service]
