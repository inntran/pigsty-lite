---
# Variables prefixed `patroni_`. Patroni owns the PG cluster lifecycle:
# initdb, recovery, replication slots, switchover. This role places the
# binary, config, systemd unit settings, and firewalld rule.

# Packages
patroni_packages:
  - patroni
  - patroni-etcd
  - python3-psycopg3

# dnf id of the EPEL repo. Un-prefixed by design: shared across roles and
# normally set in group_vars; this is the standalone fallback.
epel_repo_id: epel

# Filesystem
patroni_config_dir: /etc/patroni
patroni_config_file: "{{ patroni_config_dir }}/patroni.yml"
patroni_log_dir: /var/log/patroni

# PostgreSQL contract consumed by this role. group_vars/postgres.yml is the
# source of truth in production; the postgres role's defaults provide the
# same values for isolated runs (e.g. molecule scenarios). default() chains
# only cover the case where neither layer is loaded.
patroni_postgres_user: "{{ postgres_user | default('postgres') }}"
patroni_postgres_group: "{{ postgres_group | default('postgres') }}"
patroni_postgres_data_dir: "{{ postgres_data_dir | default('/var/lib/pgsql/' ~ postgres_version ~ '/data') }}"
patroni_postgres_listen_address: "{{ postgres_listen_address | default(network_any_address | default('0.0.0.0')) }}"
patroni_postgres_port: "{{ postgres_port | default(5432) }}"

# TLS (reuse per-host cert from P0 certs role) - Patroni REST and PG SSL
patroni_cert_file: "{{ pigsty_pki_dir }}/{{ inventory_hostname }}.crt"
patroni_key_file: "{{ pigsty_pki_dir }}/{{ inventory_hostname }}.key"
patroni_trusted_ca_file: "{{ pigsty_pki_dir }}/ca.crt"

# Network
patroni_listen_address: "{{ network_any_address | default('0.0.0.0') }}"
# Fall back to a detected address only when `ansible_host` is unset. Prefer the
# IPv6 fact first on single-stack v6 hosts, where default_ipv4 is undefined.
patroni_advertise_address: >-
  {{ ansible_host
     | default(
         (ansible_facts | default({})).get('default_ipv6', {}).get('address')
         if (network_ipv6_single_stack | default(false) | bool)
         else (ansible_facts | default({})).get('default_ipv4', {}).get('address')
       )
     | mandatory('patroni_advertise_address: set ansible_host, or ensure the host has a default route address for the configured ip_version') }}

# pg_hba source CIDRs, address-family aware (see patroni.yml.j2).
patroni_hba_any_cidr: "{{ '::/0' if (network_ipv6_single_stack | default(false) | bool) else '0.0.0.0/0' }}"
patroni_hba_loopback_cidr: "{{ '::1/128' if (network_ipv6_single_stack | default(false) | bool) else '127.0.0.1/32' }}"
patroni_rest_port: 8008

# Patroni REST probes verify against the pigsty-lite CA distributed by
# roles/certs; patroni_advertise_address is covered by the host cert SANs.
patroni_rest_validate_certs: true

# DCS - rendered by template from groups['etcd']
patroni_etcd_protocol: https

# Cluster identity
patroni_scope: "{{ cluster_name | default('pigsty-lite') }}"
patroni_namespace: "/{{ patroni_scope }}/"

# PG bootstrap - operator-tunable knobs.
patroni_bootstrap_timeout_seconds: 300
patroni_replication_user: replicator
patroni_superuser: postgres
patroni_rewind_user: rewind_user

# Passwords are sourced from the vault layer (inventory/group_vars/all/vault.yml,
# generated by ./configure). Tests override the left-hand var directly in
# inventory (higher precedence), which short-circuits the vault lookup.
# Production must provide the vault_* var or `mandatory` errors loudly.
patroni_superuser_password: >-
  {{ vault_patroni_superuser_password
     | mandatory('vault_patroni_superuser_password not set; run ./configure to bootstrap the vault') }}
patroni_replication_password: >-
  {{ vault_patroni_replication_password
     | mandatory('vault_patroni_replication_password not set; run ./configure to bootstrap the vault') }}
patroni_rewind_password: >-
  {{ vault_patroni_rewind_password
     | mandatory('vault_patroni_rewind_password not set; run ./configure to bootstrap the vault') }}

# Memory-derived params (overridable)
patroni_shared_buffer_ratio: "{{ postgres_shared_buffer_ratio | default(0.25) }}"
patroni_tune_profile: "{{ postgres_tune_profile | default('oltp') }}"

# Service control
patroni_service_name: patroni
patroni_systemd_dropin_dir: "/etc/systemd/system/{{ patroni_service_name }}.service.d"
patroni_systemd_dropin_file: "{{ patroni_systemd_dropin_dir }}/10-pigsty-lite.conf"

# Firewall
patroni_firewalld_zone: "{{ firewalld_default_zone | default('public') }}"
patroni_firewalld_service_name: patroni-rest

# pg_hba management
# When true, Patroni writes pg_hba.conf via postgresql.pg_hba on every
# reconcile loop. Set to false (default) to let roles/provision manage it.
patroni_pg_hba_managed: false

# Health gates
patroni_leader_wait_retries: "{{ (patroni_bootstrap_timeout_seconds | int) // 5 }}"
patroni_leader_wait_delay: 5
