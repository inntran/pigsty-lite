---
- name: Fail if postgres group is empty
  ansible.builtin.assert:
    that:
      - groups['postgres'] | length > 0
    fail_msg: "HAProxy requires at least one host in the 'postgres' group."
  run_once: true
  delegate_to: localhost
  tags: [haproxy, assert]

- name: Stat patroni-rest firewalld service (P2a should have installed it)
  ansible.builtin.stat:
    path: /etc/firewalld/services/patroni-rest.xml
  register: haproxy_patroni_svc_stat
  tags: [haproxy, assert]

- name: Warn if patroni-rest firewalld service missing
  ansible.builtin.debug:
    msg: >-
      patroni-rest firewalld service not present at
      /etc/firewalld/services/patroni-rest.xml. HAProxy will still work
      (it talks to Patroni REST locally over loopback), but the cross-host
      health checks won't traverse firewalld until P2a's patroni role runs.
  when: not haproxy_patroni_svc_stat.stat.exists
  tags: [haproxy, assert]

- name: Install HAProxy
  ansible.builtin.dnf:
    name: "{{ haproxy_package }}"
    state: present
  tags: [haproxy, install]

- name: Allow HAProxy to connect to arbitrary TCP ports (Patroni REST 8008 on peers)
  ansible.posix.seboolean:
    name: haproxy_connect_any
    state: true
    persistent: true
  when: ansible_facts.selinux.status == "enabled"
  tags: [haproxy, install, selinux]

- name: Render sysctl file for vip-manager HAProxy binds
  ansible.builtin.template:
    src: haproxy-vip-sysctl.conf.j2
    dest: /etc/sysctl.d/90-pigsty-lite-haproxy-vip.conf
    owner: root
    group: root
    mode: "0644"
  register: haproxy_vip_sysctl_file
  when: vip_manager_enabled | default(false) | bool
  tags: [haproxy, install, sysctl]

- name: Apply sysctl file for vip-manager HAProxy binds
  ansible.builtin.command:
    cmd: sysctl -p /etc/sysctl.d/90-pigsty-lite-haproxy-vip.conf
  changed_when: haproxy_vip_sysctl_file.changed
  when:
    - vip_manager_enabled | default(false) | bool
    - haproxy_vip_sysctl_file.changed
  tags: [haproxy, install, sysctl]

# haproxy.cfg's server lines and the backend firewall rule must agree on each
# member's address, so resolve it once. Each lookup step is guarded with
# `is defined`: a missing ansible_host falls through to the member's gathered
# facts instead of failing eagerly, and members outside --limit still resolve
# via inventory (ansible_host). Includes this host: both consumers loop over
# every member.
- name: Resolve each postgres member's backend address
  ansible.builtin.set_fact:
    haproxy_backend_addresses: >-
      {{ haproxy_backend_addresses | default({}) | combine({item: (
           hostvars[item].patroni_advertise_address
             if hostvars[item].patroni_advertise_address is defined
           else hostvars[item].ansible_host
             if hostvars[item].ansible_host is defined
           else ((hostvars[item].ansible_facts | default({}))
                  .get('default_ipv6' if (network_ipv6_single_stack | default(false) | bool) else 'default_ipv4', {})
                  .get('address'))
         ) | default('', true) | string}) }}
  loop: "{{ groups['postgres'] | default([]) }}"
  tags: [haproxy, config, firewall]

- name: Fail if a postgres member has no backend address
  ansible.builtin.assert:
    that:
      - haproxy_backend_addresses | dict2items | selectattr('value', 'equalto', '') | list | length == 0
    fail_msg: >-
      No address for postgres member(s)
      {{ haproxy_backend_addresses | dict2items | selectattr('value', 'equalto', '') | map(attribute='key') | join(', ') }}:
      set ansible_host or patroni_advertise_address for them, or gather their facts in this run.
  when: haproxy_backend_addresses is defined
  tags: [haproxy, config, firewall]

- name: Render haproxy.cfg
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: "{{ haproxy_config_file }}"
    owner: root
    group: root
    mode: "0640"
    validate: "haproxy -c -f %s"
  notify: Reload haproxy
  tags: [haproxy, config]

- name: Install haproxy-postgres firewalld service definition
  ansible.builtin.copy:
    src: "haproxy-postgres.xml"
    dest: /etc/firewalld/services/haproxy-postgres.xml
    owner: root
    group: root
    mode: "0644"
  notify: Reload firewalld
  tags: [haproxy, firewall]

- name: Flush handlers so firewalld reloads before service rules are applied
  ansible.builtin.meta: flush_handlers
  tags: [haproxy, firewall]

# HAProxy RW/RO client ports (5433/5434, service haproxy-postgres), from
# client CIDRs only. 5432 (service postgresql, including HAProxy's 5432
# frontend on the VIP) is admitted by roles/patroni; members reach 6432
# through the backend rule below, which is not opened to clients.
- name: Open HAProxy RW/RO ports to postgres_client_cidrs
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="{{ 'ipv6' if ':' in item else 'ipv4' }}"
      source address="{{ item }}"
      service name="haproxy-postgres" accept
    permanent: true
    state: enabled
    immediate: true
    zone: "{{ haproxy_firewalld_zone }}"
  loop: "{{ haproxy_client_cidrs }}"
  tags: [haproxy, firewall]

# Each haproxy instance dials its backend (pgbouncer 6432 by default,
# postgres 5432 when haproxy_backend_target=postgres) on every postgres
# member. The backend role only opens its port to loopback in the default
# topology, so without this rule haproxy can health-check member B on 8008
# (already opened by patroni) but the data plane to B:6432 silently dies.
# Sources come from haproxy_backend_addresses, the same map haproxy.cfg's
# server lines use. Using a member's address as the source is valid because
# cluster members share one network: no NAT or multi-homing between peers.
# Family is derived from the address.
- name: Open haproxy backend port from postgres peer hosts
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="{{ 'ipv6' if ':' in item.value else 'ipv4' }}"
      source address="{{ item.value }}"
      port port="{{ haproxy_backend_port }}" protocol="tcp" accept
    permanent: true
    state: enabled
    immediate: true
    zone: "{{ haproxy_firewalld_zone }}"
  loop: "{{ haproxy_backend_addresses | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }} {{ item.value }}"
  tags: [haproxy, firewall]

- name: Enable and start haproxy
  ansible.builtin.systemd:
    name: "{{ haproxy_service_name }}"
    enabled: true
    state: started
  tags: [haproxy, service]

- name: Wait for HAProxy frontends to listen
  ansible.builtin.command:
    cmd: "ss -H -ltn sport = :{{ item }}"
  register: haproxy_listener_probe
  changed_when: false
  retries: 30
  delay: 1
  until: haproxy_listener_probe.stdout | length > 0
  loop:
    - "{{ haproxy_default_port }}"
    - "{{ haproxy_primary_port }}"
    - "{{ haproxy_replica_port }}"
  tags: [haproxy, service]

- name: Wait for HAProxy stats listener
  ansible.builtin.wait_for:
    host: "{{ haproxy_stats_listen_address }}"
    port: "{{ haproxy_stats_port }}"
    timeout: 30
  tags: [haproxy, service]
