---
- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: rpm

- name: Install PGDG repo RPM
  ansible.builtin.dnf:
    name: "{{ repos_pgdg_rpm_url }}"
    state: present
    disable_gpg_check: true
  when:
    - repos_pgdg_enabled | bool
    - "'pgdg-redhat-repo' not in ansible_facts.packages"

- name: Enable PGDG repos (extras + selected major)
  ansible.builtin.command:
    cmd: >-
      dnf config-manager --set-enabled
      {{ repos_pgdg_extras_repo }}
      pgdg{{ repos_pgdg_postgres_version }}
  changed_when: false
  when: repos_pgdg_enabled | bool

- name: Disable unused PGDG PostgreSQL major repos
  ansible.builtin.command:
    cmd: >-
      dnf config-manager --set-disabled
      {{ (repos_pgdg_postgres_repo_versions
          | reject('equalto', repos_pgdg_postgres_version | int)
          | map('string') | map('regex_replace', '^', 'pgdg')
          | join(' ')) }}
  changed_when: false
  when:
    - repos_pgdg_enabled | bool
    - (repos_pgdg_postgres_repo_versions
       | reject('equalto', repos_pgdg_postgres_version | int) | list | length) > 0

# Skip on RHEL 10+: modularity was removed. RHEL 8/9 still use modules, so
# the default postgresql module would mask PGDG's package without this.
- name: Disable default PG module (RHEL < 10 only)
  when:
    - repos_pgdg_enabled | bool
    - ansible_facts['distribution_major_version'] | int < 10
  block:
    - name: Check PG module disable marker
      ansible.builtin.stat:
        path: /etc/dnf/modules.d/postgresql-disabled
      register: repos_pg_module_marker

    - name: Disable default PG module
      ansible.builtin.command: dnf -y module disable postgresql
      register: repos_pg_module_disable
      changed_when: >-
        'Disabling' in repos_pg_module_disable.stdout
        or 'Complete!' in repos_pg_module_disable.stdout
      failed_when: false
      when: not repos_pg_module_marker.stat.exists

    - name: Mark PG module disabled
      ansible.builtin.copy:
        dest: /etc/dnf/modules.d/postgresql-disabled
        content: "disabled by pigsty-lite repos role\n"
        mode: "0644"
      when: not repos_pg_module_marker.stat.exists

- name: Ensure dnf priorities plugin package is installed
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

- name: Set priority on PGDG repo sections
  ansible.builtin.command:
    cmd: >-
      dnf config-manager --save
      --setopt=pgdg-common.priority={{ repos_pgdg_priority }}
      --setopt={{ repos_pgdg_extras_repo }}.priority={{ repos_pgdg_priority }}
      --setopt=pgdg{{ repos_pgdg_postgres_version }}.priority={{ repos_pgdg_priority }}
  changed_when: false
  when: repos_pgdg_enabled | bool

# CRB and EPEL are always installed: roles such as patroni, pgbackrest and
# the monitoring stack pull packages (e.g. python3-click) that only exist in
# EPEL, and reach them via `enablerepo=epel` regardless of repos_epel_enabled.
# repos_epel_enabled controls only whether EPEL stays enabled for *normal*
# dependency resolution (the disable step at the end of this file).
- name: Enable CodeReady Builder (CRB) repository
  block:
    - name: Enable CRB via subscription-manager (RHEL)
      ansible.builtin.command:
        cmd: >-
          subscription-manager repos --enable
          codeready-builder-for-rhel-{{ ansible_facts['distribution_major_version'] }}-{{ ansible_facts['architecture'] }}-rpms
      when: ansible_facts['distribution'] == 'RedHat'
      changed_when: false

    - name: Enable CRB via dnf config-manager (CentOS/AlmaLinux/Rocky)
      ansible.builtin.command:
        cmd: dnf config-manager --set-enabled crb
      when: ansible_facts['distribution'] in ['CentOS', 'AlmaLinux', 'Rocky']
      changed_when: false

    - name: Enable CRB via dnf config-manager (OracleLinux)
      ansible.builtin.command:
        cmd: >-
          dnf config-manager --set-enabled
          ol{{ ansible_facts['distribution_major_version'] }}_codeready_builder
      when: ansible_facts['distribution'] == 'OracleLinux'
      changed_when: false

- name: Install Fedora EPEL repo package
  ansible.builtin.dnf:
    name: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
    state: present
    disable_gpg_check: true
  when: "'epel-release' not in ansible_facts.packages"

# Prime EPEL metadata so later `enablerepo=epel` installs (e.g. patroni ->
# python3-click) do not have to fetch metadata mid-transaction, which fails
# when that on-the-fly refresh is incomplete.
- name: Refresh EPEL metadata
  ansible.builtin.command:
    cmd: "dnf --enablerepo={{ repos_epel_repo_id }} makecache"
  changed_when: false

# repos_epel_enabled selects EPEL's terminal state. When false (the default)
# EPEL is disabled for normal resolution; roles that need EPEL packages still
# reach them via `enablerepo=epel`. When true, EPEL is left enabled.
- name: Disable EPEL for normal dependency resolution
  ansible.builtin.command:
    cmd: "dnf config-manager --set-disabled {{ repos_epel_repo_id }}"
  changed_when: false
  when: not (repos_epel_enabled | bool)

- name: Render /etc/yum.repos.d/pigsty.repo
  ansible.builtin.template:
    src: pigsty.repo.j2
    dest: /etc/yum.repos.d/pigsty.repo
    mode: "0644"
  when: repos_pigsty_enabled | bool

- name: Remove pigsty.repo if disabled
  ansible.builtin.file:
    path: /etc/yum.repos.d/pigsty.repo
    state: absent
  when: not (repos_pigsty_enabled | bool)
