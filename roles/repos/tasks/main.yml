---
- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: rpm

# pgdg-redhat-repo >= 42.0-69 builds every baseurl from
# `rhel-$releasever_major.$releasever_minor-$basearch`. dnf derives both halves
# by splitting $releasever, which comes from the distro's
# `system-release(releasever)` provide. RHEL, Rocky and AlmaLinux set that to
# "10.2", so both halves resolve. Oracle Linux sets it to plain "10", leaving
# $releasever_minor empty and every PGDG URL 404ing on `rhel-10.-x86_64`.
#
# Seed the var from the OS minor version, but only when dnf has none of its
# own: on an EUS host pinned to an older $releasever, dnf's value is the
# correct one and must win. PGDG is the only repo that reads it.
- name: Set up PGDG $releasever_minor shim
  when: repos_pgdg_enabled | bool
  block:
    - name: Check whether dnf resolves $releasever_minor
      ansible.builtin.command:
        cmd: dnf config-manager --dump-variables
      register: repos_dnf_variables
      changed_when: false

    - name: Seed /etc/dnf/vars/releasever_minor from the OS version
      ansible.builtin.copy:
        dest: /etc/dnf/vars/releasever_minor
        content: "{{ ansible_facts['distribution_version'].split('.')[1] }}"
        mode: "0644"
      when:
        - repos_dnf_variables.stdout is not search('(?m)^releasever_minor\s*=\s*\S')
        - "'.' in ansible_facts['distribution_version']"

- name: Install PGDG repo RPM
  ansible.builtin.dnf:
    name: "{{ repos_pgdg_rpm_url }}"
    state: present
    disable_gpg_check: true
  when:
    - repos_pgdg_enabled | bool
    - "'pgdg-redhat-repo' not in ansible_facts.packages"

- name: Enable PGDG repos (extras + selected major)
  ansible.builtin.command:
    cmd: >-
      dnf config-manager --set-enabled
      {{ repos_pgdg_extras_repo }}
      pgdg{{ repos_pgdg_postgres_version }}
  changed_when: false
  when: repos_pgdg_enabled | bool

- name: Disable unused PGDG PostgreSQL major repos
  ansible.builtin.command:
    cmd: >-
      dnf config-manager --set-disabled
      {{ (repos_pgdg_postgres_repo_versions
          | reject('equalto', repos_pgdg_postgres_version | int)
          | map('string') | map('regex_replace', '^', 'pgdg')
          | join(' ')) }}
  changed_when: false
  when:
    - repos_pgdg_enabled | bool
    - (repos_pgdg_postgres_repo_versions
       | reject('equalto', repos_pgdg_postgres_version | int) | list | length) > 0

# Skip on RHEL 10+: modularity was removed. RHEL 8/9 still use modules, so
# the default postgresql module would mask PGDG's package without this.
- name: Disable default PG module (RHEL < 10 only)
  when:
    - repos_pgdg_enabled | bool
    - ansible_facts['distribution_major_version'] | int < 10
  block:
    - name: Check PG module disable marker
      ansible.builtin.stat:
        path: /etc/dnf/modules.d/postgresql-disabled
      register: repos_pg_module_marker

    - name: Disable default PG module
      ansible.builtin.command: dnf -y module disable postgresql
      register: repos_pg_module_disable
      changed_when: >-
        'Disabling' in repos_pg_module_disable.stdout
        or 'Complete!' in repos_pg_module_disable.stdout
      failed_when: false
      when: not repos_pg_module_marker.stat.exists

    - name: Mark PG module disabled
      ansible.builtin.copy:
        dest: /etc/dnf/modules.d/postgresql-disabled
        content: "disabled by pigsty-lite repos role\n"
        mode: "0644"
      when: not repos_pg_module_marker.stat.exists

- name: Ensure dnf priorities plugin package is installed
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

- name: Set priority on PGDG repo sections
  ansible.builtin.command:
    cmd: >-
      dnf config-manager --save
      --setopt=pgdg-common.priority={{ repos_pgdg_priority }}
      --setopt={{ repos_pgdg_extras_repo }}.priority={{ repos_pgdg_priority }}
      --setopt=pgdg{{ repos_pgdg_postgres_version }}.priority={{ repos_pgdg_priority }}
  changed_when: false
  when: repos_pgdg_enabled | bool

# CRB is best-effort on RHEL: an already-enabled repo id matching
# codeready/crb (e.g. an internal mirror) is accepted; otherwise
# subscription-manager is tried and a failure only warns. The tested package
# set resolved on EL10 without CRB. EPEL is always installed: roles such as
# patroni, pgbackrest and the monitoring stack pull packages (e.g.
# python3-click) that only exist in EPEL, and reach them via `enablerepo=epel`
# regardless of repos_epel_enabled. repos_epel_enabled controls only whether
# EPEL stays enabled for *normal* dependency resolution (the disable step at
# the end of this file).
- name: Enable CodeReady Builder (CRB) repository
  block:
    - name: Check for an enabled CRB repository (RHEL)
      ansible.builtin.command:
        cmd: dnf repolist --enabled -q
      register: repos_enabled_repolist
      changed_when: false
      when: ansible_facts['distribution'] == 'RedHat'

    - name: Enable CRB via subscription-manager (RHEL)
      ansible.builtin.command:
        cmd: >-
          subscription-manager repos --enable
          codeready-builder-for-rhel-{{ ansible_facts['distribution_major_version'] }}-{{ ansible_facts['architecture'] }}-rpms
      register: repos_crb_subscription
      failed_when: false
      when:
        - ansible_facts['distribution'] == 'RedHat'
        - repos_enabled_repolist.stdout is not search('(?im)^\S*(codeready|crb)\S*(\s|$)')
      changed_when: false

    - name: Warn that CRB could not be enabled (RHEL)
      ansible.builtin.debug:
        msg: >-
          CRB could not be enabled via subscription-manager and no enabled repo
          id matches codeready/crb; continuing because the packages pigsty-lite
          installs do not currently need CRB, but an EPEL package that does
          will fail at install time.
          stdout: {{ repos_crb_subscription.stdout }}
          stderr: {{ repos_crb_subscription.stderr }}
      when: repos_crb_subscription.rc | default(0) != 0

    - name: Enable CRB via dnf config-manager (CentOS/AlmaLinux/Rocky)
      ansible.builtin.command:
        cmd: dnf config-manager --set-enabled crb
      when: ansible_facts['distribution'] in ['CentOS', 'AlmaLinux', 'Rocky']
      changed_when: false

    - name: Enable CRB via dnf config-manager (OracleLinux)
      ansible.builtin.command:
        cmd: >-
          dnf config-manager --set-enabled
          ol{{ ansible_facts['distribution_major_version'] }}_codeready_builder
      when: ansible_facts['distribution'] == 'OracleLinux'
      changed_when: false

- name: Install Fedora EPEL repo package
  ansible.builtin.dnf:
    name: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
    state: present
    disable_gpg_check: true
  when: "'epel-release' not in ansible_facts.packages"

# Prime EPEL metadata so later `enablerepo=epel` installs (e.g. patroni ->
# python3-click) do not have to fetch metadata mid-transaction, which fails
# when that on-the-fly refresh is incomplete.
#
# `--disablerepo='*'` keeps this to EPEL, which is all the comment above ever
# claimed. Without it makecache refreshes every enabled repo, so a third-party
# repo having a bad day -- Grafana published a repomd.xml that its own
# repomd.xml.asc does not verify on 2026-10-01 -- fails the OS baseline for
# every host, nowhere near the role that actually wants that repo.
- name: Refresh EPEL metadata
  ansible.builtin.command:
    cmd: "dnf --disablerepo='*' --enablerepo={{ epel_repo_id }} makecache"
  changed_when: false

# repos_epel_enabled selects EPEL's terminal state. When false (the default)
# EPEL is disabled for normal resolution; roles that need EPEL packages still
# reach them via `enablerepo=epel`. When true, EPEL is left enabled.
- name: Disable EPEL for normal dependency resolution
  ansible.builtin.command:
    cmd: "dnf config-manager --set-disabled {{ epel_repo_id }}"
  changed_when: false
  when: not (repos_epel_enabled | bool)

- name: Render /etc/yum.repos.d/pigsty.repo
  ansible.builtin.template:
    src: pigsty.repo.j2
    dest: /etc/yum.repos.d/pigsty.repo
    mode: "0644"
  when: repos_pigsty_enabled | bool

- name: Remove pigsty.repo if disabled
  ansible.builtin.file:
    path: /etc/yum.repos.d/pigsty.repo
    state: absent
  when: not (repos_pigsty_enabled | bool)
