---
- name: Reload systemd for monitoring_agents
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart node-exporter
  ansible.builtin.systemd:
    name: node-exporter
    state: restarted

- name: Restart postgres-exporter
  ansible.builtin.systemd:
    name: postgres-exporter
    state: restarted

- name: Restart pgbouncer-exporter
  ansible.builtin.systemd:
    name: pgbouncer-exporter
    state: restarted

- name: Restart pgbackrest-exporter
  ansible.builtin.systemd:
    name: pgbackrest-exporter
    state: restarted

- name: Reload firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: reloaded

- name: Reload nginx for monitoring_agents
  ansible.builtin.systemd:
    name: nginx
    state: reloaded

# The agents read the CA once at startup. A rotated CA is a new file but the
# same ExecStart line, so the upstream vmagent/vlagent roles see nothing to
# do and leave both processes trusting the old issuer.
- name: Restart vmagent
  ansible.builtin.systemd:
    name: vic-vmagent
    state: restarted

- name: Restart vlagent
  ansible.builtin.systemd:
    name: vic-vlagent
    state: restarted
