    sha256: 7f994fbd109bf93d292de827714041f245702a0ad8c9e003f1ffc7c243c96e56
    url: https://github.com/woblerr/pgbackrest_exporter/releases/download/v0.24.0/pgbackrest_exporter_0.24.0_linux_x86_64.rpm
