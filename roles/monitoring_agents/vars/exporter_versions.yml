---
# Pinned exporter releases for roles/monitoring_agents.
#
# Generated by bin/check_exporter_releases.py. Refresh with:
#
#     ./bin/check_exporter_releases.py --update
#
# which queries each project's latest GitHub release via `gh` and rewrites
# this file. Run it without --update (or with --check) to report drift
# without writing.
#
# Why these are pinned rather than floated:
#   - None of the four are packaged in PGDG or the vendor repos for EL10
#     (see docs/reference/pgdg-packages.md), so they are fetched as release
#     artifacts rather than installed with dnf.
#   - A fetched artifact needs a checksum to be verifiable, and a checksum
#     only means something against a fixed version.
#
# Every entry is a linux/amd64 tarball. pgbackrest_exporter also publishes an
# RPM, but installing three exporters one way and the fourth another buys
# nothing: the RPM's unit file and user would be overridden by this role
# regardless, so it would be a second code path for no gain.
#
# sha256 values are the upstream-published checksums for the exact artifact
# named in `asset`, taken from each release's checksums file -- not computed
# locally from a download, which would only prove the download matched itself.
#
# See docs/reference/exporters.md for what each exporter is and why it was
# chosen.

monitoring_agents_exporter_releases:
  node_exporter:
    repo: prometheus/node_exporter
    version: "1.12.1"
    tag: v1.12.1
    released: "2026-07-14"
    license: Apache-2.0
    asset: node_exporter-1.12.1.linux-amd64.tar.gz
    sha256: b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63
    url: https://github.com/prometheus/node_exporter/releases/download/v1.12.1/node_exporter-1.12.1.linux-amd64.tar.gz

  postgres_exporter:
    repo: prometheus-community/postgres_exporter
    version: "0.20.1"
    tag: v0.20.1
    released: "2026-07-08"
    license: Apache-2.0
    asset: postgres_exporter-0.20.1.linux-amd64.tar.gz
    sha256: 89d4f7e7920cad48fdc3133f789556ef5253c330a9f5fdace3bdb6344c0a8b5a
    url: https://github.com/prometheus-community/postgres_exporter/releases/download/v0.20.1/postgres_exporter-0.20.1.linux-amd64.tar.gz

  pgbouncer_exporter:
    repo: prometheus-community/pgbouncer_exporter
    version: "0.12.1"
    tag: v0.12.1
    released: "2026-06-26"
    license: MIT
    asset: pgbouncer_exporter-0.12.1.linux-amd64.tar.gz
    sha256: fa391b513d3a3f03843a6e0d64e711fda1f057dc43133db5c1b130ba38767857
    url: https://github.com/prometheus-community/pgbouncer_exporter/releases/download/v0.12.1/pgbouncer_exporter-0.12.1.linux-amd64.tar.gz

  # Also published as .rpm and .deb; we take the tarball like the other three.
  # Note the asset naming differs -- `linux-x86_64`, not `linux-amd64`.
  pgbackrest_exporter:
    repo: woblerr/pgbackrest_exporter
    version: "0.24.0"
    tag: v0.24.0
    released: "2026-07-30"
    license: MIT
    asset: pgbackrest_exporter-0.24.0-linux-x86_64.tar.gz
    sha256: a6e6a5adf85fb7c46dc3a3212efcba2045b9c543a1d162ddc868b821bd1d0f10
    url: https://github.com/woblerr/pgbackrest_exporter/releases/download/v0.24.0/pgbackrest_exporter-0.24.0-linux-x86_64.tar.gz
