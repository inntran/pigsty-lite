---
# roles/monitoring_agents/defaults/main.yml
# All variables prefixed `monitoring_agents_`. Exporters bind
# network_any_address and are firewalled to the monitor host. vmagent
# and vlagent bind loopback-only and remote_write/ship to the monitor.

# Exporters - install
# Exporters and the external_pull front door install from pinned upstream
# release tarballs. Versions and checksums: vars/exporter_versions.yml.
monitoring_agents_exporter_bin_dir: /usr/bin
monitoring_agents_exporter_download_timeout: 60
# systemd unit names use dashes; the exporter keys (and binaries) use
# underscores. This maps one to the other for the install task's handler.
monitoring_agents_exporter_units:
  node_exporter: node-exporter
  postgres_exporter: postgres-exporter
  pgbouncer_exporter: pgbouncer-exporter
  pgbackrest_exporter: pgbackrest-exporter
  exporter_exporter: exporter-exporter
# dnf id of the EPEL repo; shared across roles, overridable in group_vars.
epel_repo_id: epel

# Exporters - listen addresses
monitoring_agents_exporter_listen: >-
  {{ network_loopback_address | default('127.0.0.1')
     if (monitoring_mode | default('self_hosted')) in ['external_push', 'external_pull']
     else network_any_address | default('0.0.0.0') }}
monitoring_agents_node_exporter_port: "{{ node_exporter_port | default(9100) }}"
monitoring_agents_postgres_exporter_port: "{{ postgres_exporter_port | default(9187) }}"
monitoring_agents_pgbouncer_exporter_port: "{{ pgbouncer_exporter_port | default(9127) }}"
monitoring_agents_pgbackrest_exporter_port: "{{ pgbackrest_exporter_port | default(9854) }}"

# postgres_exporter / pgbouncer_exporter connect locally
monitoring_agents_postgres_exporter_dsn: >-
  host=/run/postgresql
  port={{ postgres_port | default(5432) }}
  user={{ postgres_osdba | default('postgres') }}
  dbname=postgres sslmode=disable
# pgBouncer's socket is not in PostgreSQL's socket directory: roles/pgbouncer
# puts it under pgbouncer_unix_socket_dir (/run/pgbouncer). Pointing the
# exporter at /run/postgresql leaves it logging "connect: no such file or
# directory" every scrape and publishing pgbouncer_up 0 forever.
monitoring_agents_pgbouncer_exporter_dsn: >-
  host={{ pgbouncer_unix_socket_dir | default('/run/pgbouncer') }}
  port={{ pgbouncer_port | default(6432) }}
  user={{ postgres_osdba | default('postgres') }}
  dbname=pgbouncer sslmode=disable
# The admin console is reached by peer over pgBouncer's unix socket through
# roles/pgbouncer's hba rule (auth_type = hba, pgbouncer_peer_console_user).
# Peer requires the DSN user to equal the unit's User=, so both are
# postgres_osdba; no password is stored for the exporter.
# Earlier releases wrote a pgpass file holding the Patroni superuser password;
# it is removed on converge.
monitoring_agents_legacy_pgbouncer_exporter_pgpass: "{{ monitoring_agents_pgbouncer_exporter_pgpass | default(monitoring_agents_secrets_dir ~ '/pgbouncer-exporter.pgpass') }}"
monitoring_agents_pgbackrest_stanza: "{{ backup_stanza | default(cluster_name) }}"

# vmagent (metrics scrape + remote_write)
monitoring_agents_vmagent_listen: "{{ network_loopback_address | default('127.0.0.1') }}:{{ vmagent_port | default(8429) }}"
monitoring_agents_vmagent_remote_write_url: "http://{{ hostvars[monitoring_host].ansible_host }}:{{ vmsingle_port | default(8428) }}/api/v1/write"
monitoring_agents_vmagent_buffer_dir: /var/lib/vmagent
monitoring_agents_vlagent_buffer_dir: /var/lib/vlagent
monitoring_agents_scrape_interval: "{{ monitoring_scrape_interval | default('15s') }}"

# vlagent (log shipping)
monitoring_agents_vlagent_listen: "{{ network_loopback_address | default('127.0.0.1') }}:{{ vlagent_port | default(9429) }}"
monitoring_agents_vlagent_remote_write_url: "http://{{ hostvars[monitoring_host].ansible_host }}:{{ vlsingle_port | default(9428) }}/insert/jsonline"
# The CA the agents verify against, and where it comes from.
#
# They cannot read the PKI directory: it is 0750 root:pigsty because it also
# holds every private key, and vmagent/vlagent run as vic_vm_agent and
# vic_vl_agent. Pointing them straight at {{ pigsty_pki_dir }}/ca.crt gets
# "cannot read `ca_file`: permission denied" -- which kills the patroni
# scrape *and* remote_write, because vmagent builds the TLS transport even
# when the remote_write URL is plain http.
#
# A CA certificate is public material, so publish a readable copy next to the
# agents' other config rather than widening the PKI directory or putting the
# agents in a group that can read every key in it.
monitoring_agents_ca_source: "{{ pigsty_pki_dir }}/ca.crt"
monitoring_agents_ca_file: "{{ monitoring_agents_secrets_dir }}/ca.crt"
monitoring_agents_external_auth_username: "{{ monitoring_external_auth_username | default('') }}"
monitoring_agents_external_auth_bearer: "{{ monitoring_external_auth_bearer | default(false) }}"
monitoring_agents_external_tls_skip_verify: "{{ monitoring_external_tls_skip_verify | default(false) }}"

# external_push credentials are written to these files rather than passed as
# command-line flags. The upstream victoriametrics.cluster roles interpolate
# every service arg into ExecStart of a world-readable (0644) unit file, so an
# inline password would be exposed both there and in /proc/<pid>/cmdline.
# vmagent and vlagent run as different service users, hence one file each.
monitoring_agents_secrets_dir: /etc/pigsty/monitoring
monitoring_agents_vmagent_system_user: vic_vm_agent
monitoring_agents_vlagent_system_user: vic_vl_agent
monitoring_agents_vmagent_password_file: "{{ monitoring_agents_secrets_dir }}/vmagent-remotewrite.password"
monitoring_agents_vlagent_password_file: "{{ monitoring_agents_secrets_dir }}/vlagent-remotewrite.password"
monitoring_agents_vmagent_bearer_token_file: "{{ monitoring_agents_secrets_dir }}/vmagent-remotewrite.token"
monitoring_agents_vlagent_bearer_token_file: "{{ monitoring_agents_secrets_dir }}/vlagent-remotewrite.token"

# Patroni REST + HAProxy stats scrape targets (postgres hosts only)
monitoring_agents_patroni_rest_port: "{{ patroni_rest_port | default(8008) }}"
monitoring_agents_haproxy_stats_port: "{{ haproxy_stats_port | default(7000) }}"

# Firewalld
monitoring_agents_firewalld_zone: "{{ firewalld_default_zone | default('public') }}"
monitoring_agents_systemd_dir: /etc/systemd/system

# External pull endpoint (exporter_exporter)
monitoring_agents_pull_listen_address: "{{ network_any_address | default('0.0.0.0') }}"
monitoring_agents_pull_metrics_port: "{{ monitoring_pull_metrics_port | default(9999) }}"
monitoring_agents_pull_tls: "{{ monitoring_pull_tls | default(true) }}"
monitoring_agents_pull_source_cidrs: "{{ monitoring_pull_source_cidrs | default([]) }}"
monitoring_agents_pull_tls_cert: "{{ pigsty_pki_dir }}/{{ inventory_hostname }}.crt"
monitoring_agents_pull_tls_key: "{{ pigsty_pki_dir }}/{{ inventory_hostname }}.key"
monitoring_agents_exporter_exporter_user: exporter_exporter
monitoring_agents_exporter_exporter_config_dir: /etc/exporter_exporter
monitoring_agents_exporter_exporter_config: "{{ monitoring_agents_exporter_exporter_config_dir }}/expexp.yaml"
monitoring_agents_exporter_exporter_token_file: "{{ monitoring_agents_secrets_dir }}/exporter_exporter.token"
monitoring_agents_pull_token: >-
  {{ vault_monitoring_pull_token
     | mandatory('vault_monitoring_pull_token not set; run ./configure to bootstrap the vault') }}
