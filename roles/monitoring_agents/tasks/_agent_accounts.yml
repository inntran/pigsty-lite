---
# Create the vmagent/vlagent service accounts ahead of the upstream
# victoriametrics.cluster roles.
#
# Those roles create the accounts during their own install phase and start the
# service in the same include, so anything that must be owned by an agent user
# — its buffer directory, its credential files — cannot wait until afterwards.
# Both tasks here are the same shape as the upstream ones, so the upstream
# user/group tasks find them already present and report no change.

- name: Ensure the agent service groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    system: true
    state: present
  loop:
    - "{{ monitoring_agents_vmagent_system_user }}"
    - "{{ monitoring_agents_vlagent_system_user }}"

# Mirrors the upstream task exactly — `groups` + `append` (not `group`) and
# /usr/sbin/nologin. Any difference makes the two tasks undo each other on
# every run, which molecule catches as an idempotence failure.
- name: Ensure the agent service accounts exist
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ item }}"
    append: true
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present
  loop:
    - "{{ monitoring_agents_vmagent_system_user }}"
    - "{{ monitoring_agents_vlagent_system_user }}"
