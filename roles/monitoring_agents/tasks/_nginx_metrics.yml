---
# external_pull metrics frontend. monitoring_agents runs on hosts: all, so
# this installs nginx itself rather than depending on the haproxy role
# (which only runs on postgres nodes). nginx fronts the loopback-only
# exporters with basic auth and optional TLS.

# The openssl CLI is a separate package from openssl-libs on RHEL 10, so a
# minimal host has the library but not the binary. "Hash the metrics frontend
# password" below shells out to it, and that task is no_log, so a missing
# binary surfaces as a censored failure with no cause.
- name: Install nginx and openssl for the metrics frontend
  ansible.builtin.dnf:
    name: "{{ monitoring_agents_nginx_metrics_packages }}"
    state: present

- name: Allow nginx to connect to loopback exporters
  ansible.posix.seboolean:
    name: httpd_can_network_connect
    state: true
    persistent: true
  when: ansible_facts.selinux.status == "enabled"

# The hashing task below is no_log, so any failure there is censored and
# gives the operator nothing to go on. Check the binary here, where the
# error can actually be reported.
- name: Verify the openssl CLI is available for password hashing
  ansible.builtin.command:
    cmd: openssl version
  changed_when: false
  register: monitoring_agents_openssl_probe
  failed_when: monitoring_agents_openssl_probe.rc != 0

- name: Derive a deterministic salt for the htpasswd hash
  # Stable salt -> stable hash -> idempotent on re-runs. The salt is not
  # secret; it only prevents identical-password collisions across hosts.
  ansible.builtin.set_fact:
    monitoring_agents_pull_htpasswd_salt: >-
      {{ (monitoring_agents_pull_auth_username ~ inventory_hostname)
         | hash('md5') | truncate(8, true, '') }}

- name: Hash the metrics frontend password
  # The password goes in on stdin, not as an argument: argv is world-readable
  # through /proc/<pid>/cmdline while the command runs.
  ansible.builtin.command:
    cmd: >-
      openssl passwd -apr1
      -salt {{ monitoring_agents_pull_htpasswd_salt }}
      -stdin
    stdin: "{{ monitoring_agents_pull_password }}"
    stdin_add_newline: false
  changed_when: false
  no_log: true
  register: monitoring_agents_pull_htpasswd_hash
  failed_when: >-
    monitoring_agents_pull_htpasswd_hash.rc != 0
    or not monitoring_agents_pull_htpasswd_hash.stdout.startswith('$apr1$')

- name: Write the metrics frontend htpasswd file
  ansible.builtin.copy:
    content: "{{ monitoring_agents_pull_auth_username }}:{{ monitoring_agents_pull_htpasswd_hash.stdout }}\n"
    dest: "{{ monitoring_agents_nginx_metrics_htpasswd }}"
    owner: root
    group: nginx
    mode: "0640"
  no_log: true
  notify: Reload nginx for monitoring_agents

- name: Render the nginx metrics frontend config
  ansible.builtin.template:
    src: nginx-metrics.conf.j2
    dest: "{{ monitoring_agents_nginx_metrics_config }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx for monitoring_agents

- name: Validate nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
