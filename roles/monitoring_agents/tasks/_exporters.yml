---
# node_exporter runs on every host. The three PG-side exporters run
# only on postgres hosts. Each exporter gets its own systemd unit and
# binds network_any_address (firewalled to the monitor host in
# _firewall.yml).
#
# All four install from pinned upstream release tarballs -- none are packaged
# for EL10 by PGDG, the vendor repos, or EPEL. Versions and checksums live in
# vars/exporter_versions.yml; refresh them with
# ./bin/check_exporter_releases.py --update.

# Ansible auto-loads only vars/main.yml, and this record is deliberately kept
# under its own name (bin/check_exporter_releases.py writes it).
- name: Load the pinned exporter releases
  ansible.builtin.include_vars:
    file: exporter_versions.yml

- name: Install node_exporter
  ansible.builtin.include_tasks: _install_exporter.yml
  vars:
    exporter_name: node_exporter

- name: Ensure the node_exporter system user exists
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /sbin/nologin
    create_home: false
    state: present

- name: Render the node_exporter systemd unit
  ansible.builtin.template:
    src: node-exporter.service.j2
    dest: "{{ monitoring_agents_systemd_dir }}/node-exporter.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for monitoring_agents
    - Restart node-exporter

- name: Install the PostgreSQL-side exporters
  ansible.builtin.include_tasks: _install_exporter.yml
  vars:
    exporter_name: "{{ item }}"
  loop:
    - postgres_exporter
    - pgbouncer_exporter
    - pgbackrest_exporter
  when: inventory_hostname in groups.get('postgres', [])

- name: Render the PostgreSQL-side exporter systemd units
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: "{{ monitoring_agents_systemd_dir }}/{{ item }}.service"
    owner: root
    group: root
    mode: "0644"
  loop:
    - postgres-exporter
    - pgbouncer-exporter
    - pgbackrest-exporter
  when: inventory_hostname in groups.get('postgres', [])
  notify:
    - Reload systemd for monitoring_agents
    - "Restart {{ item }}"

- name: Flush handlers so the units are registered before enabling
  ansible.builtin.meta: flush_handlers

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: node-exporter
    enabled: true
    state: started

- name: Enable and start the PostgreSQL-side exporters
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - postgres-exporter
    - pgbouncer-exporter
    - pgbackrest-exporter
  when: inventory_hostname in groups.get('postgres', [])
