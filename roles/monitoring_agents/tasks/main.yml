---
- name: Validate preconditions
  tags: [monitoring, assert]
  block:
    - name: Fail if monitor group is empty
      ansible.builtin.assert:
        that:
          - groups['monitor'] | length > 0
        fail_msg: >-
          Inventory group 'monitor' is empty; monitoring_agents needs a
          monitor host to remote_write metrics and ship logs to.
      run_once: true
      delegate_to: localhost
      when: (monitoring_mode | default('self_hosted')) == 'self_hosted'

    # vmagent and vlagent refuse to start when both are set:
    #   "cannot simultaneously use `authorization`, `basic_auth` and
    #    `bearer_token_file`"
    # Catch it here rather than leaving the operator with an agent that
    # crash-loops after a successful-looking deploy.
    - name: Fail if external_push sets both basic auth and a bearer token
      ansible.builtin.assert:
        that:
          - not (
              monitoring_agents_external_auth_username | length > 0
              and monitoring_agents_external_auth_bearer | bool
            )
        fail_msg: >-
          monitoring.external_push.auth sets both a username and bearer:
          true. vmagent and vlagent accept only one remote_write auth
          method; choose basic auth or a bearer token, not both.
      run_once: true
      delegate_to: localhost
      when: (monitoring_mode | default('self_hosted')) == 'external_push'

    - name: Stat the CA certificate (from P0 certs role)
      ansible.builtin.stat:
        path: "{{ monitoring_agents_ca_file }}"
      register: monitoring_agents_ca_stat

    - name: Fail if the CA certificate is missing
      ansible.builtin.assert:
        that:
          - monitoring_agents_ca_stat.stat.exists
        fail_msg: >-
          Expected the pigsty-lite CA at {{ monitoring_agents_ca_file }};
          agents need it to verify the monitor host's TLS. Run the P0
          _node.yml playbook (certs role) first.
      when: (monitoring_mode | default('self_hosted')) != 'external_pull'

- name: Install and configure exporters
  ansible.builtin.import_tasks: _exporters.yml
  tags: [monitoring, install]

- name: Ensure the agent service accounts exist
  ansible.builtin.import_tasks: _agent_accounts.yml
  tags: [monitoring, config]
  when: (monitoring_mode | default('self_hosted')) != 'external_pull'

- name: Stage external_push credentials on disk
  ansible.builtin.import_tasks: _external_secrets.yml
  tags: [monitoring, config]
  when: (monitoring_mode | default('self_hosted')) == 'external_push'

# The agents create their own buffer directory only if they can write the
# parent as their unprivileged service user; under /var/lib they cannot, and
# the process exits with "cannot create directory: permission denied". The
# upstream role starts the service inside its own include, so these must
# exist beforehand — fixing ownership afterwards is too late, the restart
# budget is already spent.
- name: Pre-create the agent buffer directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: "0750"
  loop:
    - path: "{{ monitoring_agents_vmagent_buffer_dir }}"
      user: "{{ monitoring_agents_vmagent_system_user }}"
    - path: "{{ monitoring_agents_vlagent_buffer_dir }}"
      user: "{{ monitoring_agents_vlagent_system_user }}"
  loop_control:
    label: "{{ item.path }}"
  tags: [monitoring, config]
  when: (monitoring_mode | default('self_hosted')) != 'external_pull'

- name: Install and configure vmagent
  tags: [monitoring, config]
  when: (monitoring_mode | default('self_hosted')) != 'external_pull'
  block:
    - name: Ensure the vmagent config directory exists
      ansible.builtin.file:
        path: /etc/vmagent
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Render the vmagent scrape config
      ansible.builtin.template:
        src: vmagent-scrape.yml.j2
        dest: /etc/vmagent/scrape.yml
        owner: root
        group: root
        mode: "0644"

    - name: Install and configure vmagent
      ansible.builtin.include_role:
        name: victoriametrics.cluster.vmagent
      vars:
        # The upstream role replaces vmagent_service_args wholesale, so we
        # restate every flag we want — including the stream-aggregation config
        # path, which upstream always renders (empty by default).
        vmagent_service_args: >-
          {{
            {
              'httpListenAddr': monitoring_agents_vmagent_listen,
              'promscrape.config': '/etc/vmagent/scrape.yml',
              'remoteWrite.url': (
                monitoring_external_metrics_url
                if (monitoring_mode | default('self_hosted')) == 'external_push'
                else monitoring_agents_vmagent_remote_write_url
              ),
              'remoteWrite.tmpDataPath': monitoring_agents_vmagent_buffer_dir,
              'remoteWrite.streamAggr.config': vmagent_config_dir ~ '/aggregation.yml',
            }
            | combine(
              {'remoteWrite.tlsCAFile': monitoring_agents_ca_file}
              if (monitoring_mode | default('self_hosted')) == 'self_hosted'
              else {}
            )
            | combine(
              {
                'remoteWrite.basicAuth.username': monitoring_agents_external_auth_username,
                'remoteWrite.basicAuth.passwordFile': monitoring_agents_vmagent_password_file,
              }
              if (
                (monitoring_mode | default('self_hosted')) == 'external_push'
                and monitoring_agents_external_auth_username | length > 0
              )
              else {}
            )
            | combine(
              {'remoteWrite.bearerTokenFile': monitoring_agents_vmagent_bearer_token_file}
              if (
                (monitoring_mode | default('self_hosted')) == 'external_push'
                and monitoring_agents_external_auth_bearer | bool
              )
              else {}
            )
            | combine(
              {'remoteWrite.tlsInsecureSkipVerify': 'true'}
              if (
                (monitoring_mode | default('self_hosted')) == 'external_push'
                and monitoring_agents_external_tls_skip_verify | bool
              )
              else {}
            )
          }}

    - name: Ensure the vmagent buffer directory is owned by the service user
      # vic_vm_agent is the default vmagent_system_user in victoriametrics.cluster.vmagent;
      # include_role variables don't leak back, so we can't reference vmagent_system_user here.
      ansible.builtin.file:
        path: "{{ monitoring_agents_vmagent_buffer_dir }}"
        state: directory
        owner: vic_vm_agent
        group: vic_vm_agent
        mode: "0750"

    - name: Restore SELinux context on vmagent binary
      ansible.builtin.command: restorecon -v /usr/local/bin/vmagent-prod
      changed_when: false

- name: Install and configure vlagent
  tags: [monitoring, config]
  when: (monitoring_mode | default('self_hosted')) != 'external_pull'
  block:
    - name: Install and configure vlagent
      ansible.builtin.include_role:
        name: victoriametrics.cluster.vlagent
      vars:
        # vlagent has no config file format; everything is CLI flags.
        # Array-typed flags accept a YAML list — the upstream service template
        # renders each list item as a separate --flag=value argument.
        vlagent_service_args: >-
          {{
            {
              'httpListenAddr': monitoring_agents_vlagent_listen,
              'remoteWrite.url': (
                monitoring_external_logs_url
                if (monitoring_mode | default('self_hosted')) == 'external_push'
                else monitoring_agents_vlagent_remote_write_url
              ),
              'remoteWrite.tmpDataPath': monitoring_agents_vlagent_buffer_dir,
              'journald.streamFields': 'hostname',
              'fileCollector.glob': (
                [
                  '/var/lib/pgsql/' ~ (postgres_version | default('16')) ~ '/data/log/*.log',
                  '/var/log/patroni/*.log',
                ]
                if inventory_hostname in groups.get('postgres', [])
                else []
              ),
              'fileCollector.extraFields': '{\"cluster\":\"' ~ cluster_name ~ '\",\"instance\":\"' ~ inventory_hostname ~ '\"}',
              'fileCollector.streamFields': 'cluster,instance',
            }
            | combine(
              {'remoteWrite.tlsCAFile': monitoring_agents_ca_file}
              if (monitoring_mode | default('self_hosted')) == 'self_hosted'
              else {}
            )
            | combine(
              {
                'remoteWrite.basicAuth.username': monitoring_agents_external_auth_username,
                'remoteWrite.basicAuth.passwordFile': monitoring_agents_vlagent_password_file,
              }
              if (
                (monitoring_mode | default('self_hosted')) == 'external_push'
                and monitoring_agents_external_auth_username | length > 0
              )
              else {}
            )
            | combine(
              {'remoteWrite.bearerTokenFile': monitoring_agents_vlagent_bearer_token_file}
              if (
                (monitoring_mode | default('self_hosted')) == 'external_push'
                and monitoring_agents_external_auth_bearer | bool
              )
              else {}
            )
            | combine(
              {'remoteWrite.tlsInsecureSkipVerify': 'true'}
              if (
                (monitoring_mode | default('self_hosted')) == 'external_push'
                and monitoring_agents_external_tls_skip_verify | bool
              )
              else {}
            )
          }}

    - name: Ensure the vlagent buffer directory is owned by the service user
      # vic_vl_agent is the default vlagent_system_user in victoriametrics.cluster.vlagent;
      # include_role variables don't leak back, so we can't reference vlagent_system_user here.
      ansible.builtin.file:
        path: "{{ monitoring_agents_vlagent_buffer_dir }}"
        state: directory
        owner: vic_vl_agent
        group: vic_vl_agent
        mode: "0750"

    - name: Restore SELinux context on vlagent binary
      ansible.builtin.command: restorecon -v /usr/local/bin/vlagent-prod
      changed_when: false

- name: Install nginx metrics frontend for external pull
  ansible.builtin.import_tasks: _nginx_metrics.yml
  when: (monitoring_mode | default('self_hosted')) == 'external_pull'
  tags: [monitoring, nginx]

- name: Open firewalld for exporters
  ansible.builtin.import_tasks: _firewall.yml
  tags: [monitoring, firewall]
