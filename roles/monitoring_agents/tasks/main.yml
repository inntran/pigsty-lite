---
- name: Validate preconditions
  tags: [monitoring, assert]
  block:
    - name: Fail if monitor group is empty
      ansible.builtin.assert:
        that:
          - groups['monitor'] | length > 0
        fail_msg: >-
          Inventory group 'monitor' is empty; monitoring_agents needs a
          monitor host to remote_write metrics and ship logs to.
      run_once: true
      delegate_to: localhost

    - name: Stat the CA certificate (from P0 certs role)
      ansible.builtin.stat:
        path: "{{ monitoring_agents_ca_file }}"
      register: monitoring_agents_ca_stat

    - name: Fail if the CA certificate is missing
      ansible.builtin.assert:
        that:
          - monitoring_agents_ca_stat.stat.exists
        fail_msg: >-
          Expected the pigsty-lite CA at {{ monitoring_agents_ca_file }};
          agents need it to verify the monitor host's TLS. Run the P0
          _node.yml playbook (certs role) first.

#- name: Install and configure exporters
#  ansible.builtin.import_tasks: _exporters.yml
#  tags: [monitoring, install]

- name: Install and configure vmagent
  tags: [monitoring, config]
  block:
    - name: Ensure the vmagent config directory exists
      ansible.builtin.file:
        path: /etc/vmagent
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Render the vmagent scrape config
      ansible.builtin.template:
        src: vmagent-scrape.yml.j2
        dest: /etc/vmagent/scrape.yml
        owner: root
        group: root
        mode: "0644"

    - name: Install and configure vmagent
      ansible.builtin.include_role:
        name: victoriametrics.cluster.vmagent
      vars:
        # The upstream role replaces vmagent_service_args wholesale, so we
        # restate every flag we want — including the stream-aggregation config
        # path, which upstream always renders (empty by default).
        vmagent_service_args:
          httpListenAddr: "{{ monitoring_agents_vmagent_listen }}"
          "promscrape.config": /etc/vmagent/scrape.yml
          "remoteWrite.url": "{{ monitoring_agents_vmagent_remote_write_url }}"
          "remoteWrite.tlsCAFile": "{{ monitoring_agents_ca_file }}"
          "remoteWrite.tmpDataPath": "{{ monitoring_agents_vmagent_buffer_dir }}"
          "remoteWrite.streamAggr.config": "{{ vmagent_config_dir }}/aggregation.yml"

    - name: Ensure the vmagent buffer directory is owned by the service user
      # vic_vm_agent is the default vmagent_system_user in victoriametrics.cluster.vmagent;
      # include_role variables don't leak back, so we can't reference vmagent_system_user here.
      ansible.builtin.file:
        path: "{{ monitoring_agents_vmagent_buffer_dir }}"
        state: directory
        owner: vic_vm_agent
        group: vic_vm_agent
        mode: "0750"

    - name: Restore SELinux context on vmagent binary
      ansible.builtin.command: restorecon -v /usr/local/bin/vmagent-prod
      changed_when: false

- name: Install and configure vlagent
  tags: [monitoring, config]
  block:
    - name: Install and configure vlagent
      ansible.builtin.include_role:
        name: victoriametrics.cluster.vlagent
      vars:
        # vlagent has no config file format; everything is CLI flags.
        # Array-typed flags accept a YAML list — the upstream service template
        # renders each list item as a separate --flag=value argument.
        vlagent_service_args:
          httpListenAddr: "{{ monitoring_agents_vlagent_listen }}"
          "remoteWrite.url": "{{ monitoring_agents_vlagent_remote_write_url }}"
          "remoteWrite.tlsCAFile": "{{ monitoring_agents_ca_file }}"
          "remoteWrite.tmpDataPath": "{{ monitoring_agents_vlagent_buffer_dir }}"
          "journald.streamFields": "hostname"
          "fileCollector.glob": >-
            {{ [
                '/var/lib/pgsql/' ~ (postgres_version | default('16')) ~ '/data/log/*.log',
                '/var/log/patroni/*.log'
               ]
               if inventory_hostname in groups.get('postgres', [])
               else [] }}
          "fileCollector.extraFields": '{\"cluster\":\"{{ cluster_name }}\",\"instance\":\"{{ inventory_hostname }}\"}'
          "fileCollector.streamFields": "cluster,instance"

    - name: Ensure the vlagent buffer directory is owned by the service user
      # vic_vl_agent is the default vlagent_system_user in victoriametrics.cluster.vlagent;
      # include_role variables don't leak back, so we can't reference vlagent_system_user here.
      ansible.builtin.file:
        path: "{{ monitoring_agents_vlagent_buffer_dir }}"
        state: directory
        owner: vic_vl_agent
        group: vic_vl_agent
        mode: "0750"

    - name: Restore SELinux context on vlagent binary
      ansible.builtin.command: restorecon -v /usr/local/bin/vlagent-prod
      changed_when: false

