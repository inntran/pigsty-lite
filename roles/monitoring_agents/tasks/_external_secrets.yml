---
# Write external_push remote_write credentials to root-owned files readable
# only by the agent that needs them.
#
# The upstream victoriametrics.cluster roles render every entry of
# vmagent_service_args / vlagent_service_args into the ExecStart line of a
# 0644 systemd unit. Passing a password inline therefore leaks it twice: in
# the unit file, and in /proc/<pid>/cmdline for every local user. vmagent and
# vlagent both support -remoteWrite.basicAuth.passwordFile and
# -remoteWrite.bearerTokenFile, which read the value from disk instead.

- name: Ensure the monitoring secrets directory exists
  ansible.builtin.file:
    path: "{{ monitoring_agents_secrets_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The upstream roles create these accounts during their own install phase,
# which runs after this file. Create the groups up front so the credential
# files below can be group-owned by the agent that reads them; the upstream
# user task is idempotent and reuses the existing group.
- name: Ensure the agent service groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    system: true
    state: present
  loop:
    - "{{ monitoring_agents_vmagent_system_user }}"
    - "{{ monitoring_agents_vlagent_system_user }}"

- name: Write remote_write basic-auth password files
  ansible.builtin.copy:
    content: "{{ vault_monitoring_external_password }}"
    dest: "{{ item.path }}"
    owner: root
    group: "{{ item.group }}"
    mode: "0640"
  loop:
    - path: "{{ monitoring_agents_vmagent_password_file }}"
      group: "{{ monitoring_agents_vmagent_system_user }}"
    - path: "{{ monitoring_agents_vlagent_password_file }}"
      group: "{{ monitoring_agents_vlagent_system_user }}"
  loop_control:
    label: "{{ item.path }}"
  no_log: true
  when: monitoring_agents_external_auth_username | length > 0

- name: Write remote_write bearer token files
  ansible.builtin.copy:
    content: "{{ vault_monitoring_external_bearer_token }}"
    dest: "{{ item.path }}"
    owner: root
    group: "{{ item.group }}"
    mode: "0640"
  loop:
    - path: "{{ monitoring_agents_vmagent_bearer_token_file }}"
      group: "{{ monitoring_agents_vmagent_system_user }}"
    - path: "{{ monitoring_agents_vlagent_bearer_token_file }}"
      group: "{{ monitoring_agents_vlagent_system_user }}"
  loop_control:
    label: "{{ item.path }}"
  no_log: true
  when: monitoring_agents_external_auth_bearer | bool

- name: Remove credential files that are no longer configured
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop:
    - path: "{{ monitoring_agents_vmagent_password_file }}"
      keep: "{{ monitoring_agents_external_auth_username | length > 0 }}"
    - path: "{{ monitoring_agents_vlagent_password_file }}"
      keep: "{{ monitoring_agents_external_auth_username | length > 0 }}"
    - path: "{{ monitoring_agents_vmagent_bearer_token_file }}"
      keep: "{{ monitoring_agents_external_auth_bearer | bool }}"
    - path: "{{ monitoring_agents_vlagent_bearer_token_file }}"
      keep: "{{ monitoring_agents_external_auth_bearer | bool }}"
  loop_control:
    label: "{{ item.path }}"
  when: not (item.keep | bool)
