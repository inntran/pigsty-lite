---
# Idempotence: stanza-create writes
# {{ pgbackrest_repo_path }}/archive/<stanza>/archive.info on the
# server. Test for that file and skip stanza-create when it's present.
#
# --no-online makes stanza-create local-only: it writes the repo
# metadata without dialing PostgreSQL. Two consequences:
#   1. No race against Patroni's leader election during bootstrap (the
#      online path bails with error 056 "unable to find primary cluster"
#      when Patroni is still settling).
#   2. The task runs directly on the backup_server -- no delegation to
#      a postgres node, since libpq isn't involved.
# The missing cluster identity is populated on the first archive-push,
# and verified by `pgbackrest check` in _archive.yml once archive_command
# is live. Upstream pigsty uses the same --no-online flag.

- name: Check whether stanza archive.info already exists on the server
  ansible.builtin.stat:
    path: "{{ pgbackrest_repo_path }}/archive/{{ pgbackrest_stanza }}/archive.info"
  register: _pgbackrest_stanza_archive_info

- name: Create pgBackRest stanza
  ansible.builtin.command:
    cmd: pgbackrest --stanza={{ pgbackrest_stanza }} --no-online stanza-create
  become: true
  become_user: "{{ pgbackrest_user }}"
  when: not _pgbackrest_stanza_archive_info.stat.exists
  changed_when: true

# Note: `pgbackrest check` is run at the end of _archive.yml, once
# archive_command is live in Postgres. Running it here fails with
# error 068 because archive_command is still the placeholder.
