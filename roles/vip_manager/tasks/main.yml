---
- name: Install vip-manager from PGDG-extras
  ansible.builtin.dnf:
    name: "{{ vip_manager_package }}"
    state: present
  tags: [vip_manager, install]

- name: Ensure vip-manager is stopped and disabled when not enabled
  ansible.builtin.systemd:
    name: "{{ vip_manager_service_name }}"
    enabled: false
    state: stopped
  when: not (vip_manager_enabled | bool)
  tags: [vip_manager, service]

- name: Remove vip-manager.yml when not enabled
  ansible.builtin.file:
    path: "{{ vip_manager_config_file }}"
    state: absent
  when: not (vip_manager_enabled | bool)
  tags: [vip_manager, config]

- name: End play when vip-manager is disabled
  ansible.builtin.meta: end_play
  when: not (vip_manager_enabled | bool)

- name: Fail unless VIP CIDR is set
  ansible.builtin.assert:
    that:
      - vip_manager_vip_cidr | length > 0
    fail_msg: >-
      vip_manager_enabled is true but vip_manager_vip_cidr is empty.
      Set it in the response file.
  tags: [vip_manager, assert]

- name: Auto-detect vip-manager interface when not explicitly set
  when: vip_manager_interface | length == 0
  tags: [vip_manager, assert]
  vars:
    _target_address: "{{ ansible_host | default(inventory_hostname) }}"
    _matched_interfaces: >-
      {%- set result = [] -%}
      {%- for iface in ansible_facts.interfaces | default([]) -%}
        {%- set iface_facts = ansible_facts[iface] | default({}) -%}
        {%- if iface_facts.ipv4 is defined and iface_facts.ipv4.address == _target_address -%}
          {%- set _ = result.append(iface) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ result }}
  block:
    - name: Fail if no interface auto-detected for this host
      ansible.builtin.assert:
        that:
          - _matched_interfaces | length > 0
        fail_msg: >-
          vip_manager_interface was not set and no interface on
          {{ inventory_hostname }} carries the address
          {{ _target_address }}. Existing interfaces:
          {{ ansible_facts.interfaces | default([]) | join(', ') }}.
          Set vip_manager_interface explicitly in the response file.

    - name: Use auto-detected interface
      ansible.builtin.set_fact:
        vip_manager_interface: "{{ _matched_interfaces | first }}"

- name: Verify interface exists on this host
  ansible.builtin.assert:
    that:
      - vip_manager_interface in (ansible_facts.interfaces | default([]))
    fail_msg: >-
      Interface {{ vip_manager_interface }} not found on
      {{ inventory_hostname }}. Existing interfaces:
      {{ ansible_facts.interfaces | default([]) | join(', ') }}
  tags: [vip_manager, assert]

- name: Ensure vip-manager config directory exists
  ansible.builtin.file:
    path: "{{ vip_manager_config_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [vip_manager, config]

- name: Render vip-manager.yml
  ansible.builtin.template:
    src: vip-manager.yml.j2
    dest: "{{ vip_manager_config_file }}"
    owner: root
    group: root
    mode: "0640"
  notify: Restart vip-manager
  tags: [vip_manager, config]

- name: Enable and start vip-manager
  ansible.builtin.systemd:
    name: "{{ vip_manager_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
  tags: [vip_manager, service]
