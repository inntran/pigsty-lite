---
- name: Ensure Grafana config and data directories exist
  ansible.builtin.shell:
    cmd: |
      set -e
      install -d -o root -g grafana -m 0755 \
        {{ grafana_config_dir }} \
        {{ grafana_provisioning_dir }} \
        {{ grafana_provisioning_dir }}/datasources \
        {{ grafana_provisioning_dir }}/dashboards
      install -d -o grafana -g grafana -m 0755 \
        {{ grafana_logs_dir }} \
        {{ grafana_data_dir }} \
        {{ grafana_dashboards_dir }} \
        {{ grafana_data_dir }}/plugins
  changed_when: false

- name: Render /etc/grafana/grafana.ini
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: "{{ grafana_config_dir }}/grafana.ini"
    owner: root
    group: grafana
    mode: "0640"
  no_log: "{{ 'false' if lookup('env', 'CI') else 'true' }}"
  notify: Restart grafana

- name: Enable and start grafana-server
  ansible.builtin.systemd:
    name: "{{ grafana_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
