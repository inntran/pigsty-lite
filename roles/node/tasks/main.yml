---
- name: Install node baseline packages
  ansible.builtin.dnf:
    name: "{{ node_required_packages }}"
    state: present

- name: Ensure pigsty shared group exists
  ansible.builtin.group:
    name: pigsty
    gid: 926
    system: true
    state: present

- name: Ensure pigsty shared system user exists
  ansible.builtin.user:
    name: pigsty
    uid: 926
    group: pigsty
    system: true
    shell: /sbin/nologin
    home: /var/lib/pigsty
    create_home: true
    comment: "pigsty-lite shared identity"
    state: present

- name: Lock down pigsty home
  ansible.builtin.file:
    path: /var/lib/pigsty
    state: directory
    owner: pigsty
    group: pigsty
    mode: "0750"

- name: Set hostname to inventory host
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  when: node_set_hostname | bool

- name: Ensure every inventory host is name-resolvable
  when: node_manage_etc_hosts | bool
  block:
    - name: Probe inventory hostname resolution
      ansible.builtin.command: "getent hosts {{ item }}"
      register: node_dns_probe_short
      changed_when: false
      failed_when: false
      loop: "{{ groups['all'] }}"

    - name: Probe inventory FQDN resolution
      ansible.builtin.command: "getent hosts {{ item }}.{{ cluster_domain | default('local') }}"
      register: node_dns_probe_fqdn
      changed_when: false
      failed_when: false
      loop: "{{ groups['all'] }}"

    - name: Determine whether DNS already resolves every inventory host
      ansible.builtin.set_fact:
        node_dns_ok: >-
          {{
            (node_dns_probe_short.results | default([]) | map(attribute='rc') | reject('equalto', 0) | list | length == 0)
            and
            (node_dns_probe_fqdn.results | default([]) | map(attribute='rc') | reject('equalto', 0) | list | length == 0)
          }}

    - name: Render /etc/hosts from inventory
      ansible.builtin.template:
        src: hosts.j2
        dest: /etc/hosts
        owner: root
        group: root
        mode: "0644"
        unsafe_writes: true
      when: not (node_dns_ok | bool)

    - name: Re-probe inventory hostname resolution after rendering /etc/hosts
      ansible.builtin.command: "getent hosts {{ item }}"
      changed_when: false
      loop: "{{ groups['all'] }}"
      when: not (node_dns_ok | bool)

    - name: Re-probe inventory FQDN resolution after rendering /etc/hosts
      ansible.builtin.command: "getent hosts {{ item }}.{{ cluster_domain | default('local') }}"
      changed_when: false
      loop: "{{ groups['all'] }}"
      when: not (node_dns_ok | bool)

- name: Ensure sysctl config directory exists
  ansible.builtin.file:
    path: /etc/sysctl.d
    state: directory
    mode: "0755"

- name: Apply sysctl tuning
  ansible.builtin.template:
    src: 90-pigsty-lite.conf.j2
    dest: /etc/sysctl.d/90-pigsty-lite.conf
    owner: root
    group: root
    mode: "0644"
  register: node_sysctl_render

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  when:
    - node_sysctl_render.changed
    - node_sysctl_apply | bool
  changed_when: true

- name: Ensure journald config directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Configure journald sizing
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/10-pigsty-lite.conf
    mode: "0644"
    content: |
      # MANAGED BY pigsty-lite node role
      [Journal]
      SystemMaxUse={{ node_journald_max_use }}
      MaxFileSec={{ node_journald_max_file_sec }}
  notify: Restart journald

- name: Ensure firewalld is enabled and running
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Read firewalld default zone
  ansible.builtin.command: firewall-cmd --get-default-zone
  register: node_firewalld_current_zone
  changed_when: false

- name: Set firewalld default zone
  ansible.builtin.command: firewall-cmd --set-default-zone={{ node_firewalld_default_zone }}
  changed_when: true
  when: node_firewalld_current_zone.stdout != node_firewalld_default_zone

- name: Open baseline services in default zone
  ansible.posix.firewalld:
    service: "{{ item }}"
    zone: "{{ node_firewalld_default_zone }}"
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ node_firewalld_baseline_services }}"
