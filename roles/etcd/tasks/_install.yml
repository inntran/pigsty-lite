---
- name: Install etcd package
  ansible.builtin.dnf:
    name: "{{ [etcd_package] + etcd_support_packages }}"
    state: present

- name: Ensure etcd user is in the pigsty group to read shared PKI files
  ansible.builtin.user:
    name: etcd
    groups: pigsty
    append: true

- name: Ensure config directory exists
  ansible.builtin.file:
    path: "{{ etcd_config_dir }}"
    state: directory
    owner: root
    group: etcd
    mode: "0750"

- name: Ensure data directory exists with correct ownership
  ansible.builtin.file:
    path: "{{ etcd_data_dir }}"
    state: directory
    owner: etcd
    group: etcd
    mode: "0700"
  # No SELinux fcontext registration: the targeted policy ships no etcd
  # module, so there is no etcd-specific type. etcd runs unconfined and
  # the data dir under /var/lib already gets the default var_lib_t label.
