---
# Variables prefixed `postgres_`. Vendor PGDG paths so SELinux fcontext
# is inherited where possible. Patroni drives bootstrap; this role never
# runs initdb or writes postgresql.conf.

# Versioning - postgres_version comes from group_vars/all.yml (default 18).
postgres_pkg_server: "postgresql{{ postgres_version }}-server"
postgres_pkg_contrib: "postgresql{{ postgres_version }}-contrib"
postgres_pkg_libs: "postgresql{{ postgres_version }}"
postgres_support_packages:
  - python3-libselinux
  - policycoreutils-python-utils

# Filesystem mode (paths/user/group come from group_vars/postgres.yml).
postgres_data_dir_mode: "0700"

# OS / vendor unit handling
postgres_vendor_systemd_unit: "postgresql-{{ postgres_version }}.service"
postgres_mask_vendor_unit: true

# postgres_user, postgres_group, postgres_base_dir, postgres_version_dir,
# postgres_data_dir, postgres_log_dir, postgres_listen_address are all defined
# in group_vars/postgres.yml as the role contract shared with patroni.
# postgres_port lives in group_vars/all/main.yml (shared cluster-wide).
