---
name: molecule
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}/molecule-base

jobs:
  resolve-images:
    runs-on: ubuntu-latest
    outputs:
      common-tag: ${{ steps.tags.outputs.common }}
      data-tag: ${{ steps.tags.outputs.data }}
      infra-tag: ${{ steps.tags.outputs.infra }}
      common-ref: ${{ steps.tags.outputs.common-ref }}
      data-ref: ${{ steps.tags.outputs.data-ref }}
      infra-ref: ${{ steps.tags.outputs.infra-ref }}
    steps:
      - uses: actions/checkout@v6

      - name: Compute image tags from Containerfile hashes
        id: tags
        run: |
          common=$(sha256sum tests/molecule/images/common/Containerfile | awk '{print $1}' | cut -c1-16)
          data=$(sha256sum tests/molecule/images/data/Containerfile   | awk '{print $1}' | cut -c1-16)
          infra=$(sha256sum tests/molecule/images/infra/Containerfile  | awk '{print $1}' | cut -c1-16)
          # data/infra depend on common's content too
          data_tag="${common}-${data}"
          infra_tag="${common}-${infra}"
          prefix="${IMAGE_PREFIX,,}"
          echo "common=${common}" >> "$GITHUB_OUTPUT"
          echo "data=${data_tag}" >> "$GITHUB_OUTPUT"
          echo "infra=${infra_tag}" >> "$GITHUB_OUTPUT"
          echo "common-ref=${prefix}-common:${common}" >> "$GITHUB_OUTPUT"
          echo "data-ref=${prefix}-data:${data_tag}" >> "$GITHUB_OUTPUT"
          echo "infra-ref=${prefix}-infra:${infra_tag}" >> "$GITHUB_OUTPUT"

  build-images:
    needs: resolve-images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build/push common if missing
        env:
          REF: ${{ needs.resolve-images.outputs.common-ref }}
        run: |
          if podman manifest inspect "$REF" >/dev/null 2>&1; then
            echo "[skip] $REF already present"
            exit 0
          fi
          podman build -f tests/molecule/images/common/Containerfile \
            -t "$REF" tests/molecule/images/common
          podman push "$REF"

      - name: Build/push data if missing
        env:
          REF: ${{ needs.resolve-images.outputs.data-ref }}
          COMMON_REF: ${{ needs.resolve-images.outputs.common-ref }}
        run: |
          if podman manifest inspect "$REF" >/dev/null 2>&1; then
            echo "[skip] $REF already present"
            exit 0
          fi
          podman pull "$COMMON_REF"
          podman build -f tests/molecule/images/data/Containerfile \
            --build-arg "COMMON_IMAGE=$COMMON_REF" \
            -t "$REF" tests/molecule/images/data
          podman push "$REF"

      - name: Build/push infra if missing
        env:
          REF: ${{ needs.resolve-images.outputs.infra-ref }}
          COMMON_REF: ${{ needs.resolve-images.outputs.common-ref }}
        run: |
          if podman manifest inspect "$REF" >/dev/null 2>&1; then
            echo "[skip] $REF already present"
            exit 0
          fi
          podman pull "$COMMON_REF"
          podman build -f tests/molecule/images/infra/Containerfile \
            --build-arg "COMMON_IMAGE=$COMMON_REF" \
            -t "$REF" tests/molecule/images/infra
          podman push "$REF"

  bootstrap-scenarios:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: provision
            scenario: default
          - role: repos
            scenario: default
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install python tooling
        run: |
          uv pip install --system \
            ansible \
            "molecule==25.*" \
            "molecule-plugins[podman]==25.*" \
            cryptography \
            pytest

      - name: Cache Galaxy content
        id: galaxy-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.ansible/collections
            roles.galaxy
          key: galaxy-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      - name: Install Galaxy content
        if: steps.galaxy-cache.outputs.cache-hit != 'true'
        run: |
          ansible-galaxy collection install -r requirements.yml
          ansible-galaxy role install -r requirements.yml -p ./roles.galaxy

      # Ubuntu 24.04 ships a path-based AppArmor profile for unix_chkpwd.
      # Path profiles apply across container boundaries, so the container's
      # /usr/sbin/unix_chkpwd inherits the host profile and is denied
      # dac_read_search/dac_override on its own /etc/shadow, breaking sudo's
      # PAM stack with: "Authentication service cannot retrieve authentication
      # info". Unloading the host profile removes the cross-namespace
      # confinement; the runner is ephemeral so this has no lasting effect.
      - name: Unload host unix-chkpwd AppArmor profile
        run: sudo apparmor_parser -R /etc/apparmor.d/unix-chkpwd || true

      - name: molecule ${{ matrix.role }} (${{ matrix.scenario }})
        run: |
          cd tests/molecule/${{ matrix.role }}
          molecule test -s ${{ matrix.scenario }}

  derived-scenarios:
    needs: [resolve-images, build-images]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: cluster_ops
            scenario: default
            images: data
          - role: backup
            scenario: ha
            images: data,infra
          - role: haproxy
            scenario: ha
            images: data
          - role: nginx_proxy
            scenario: default
            images: infra
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull common image
        if: contains(matrix.images, 'common')
        env:
          REF: ${{ needs.resolve-images.outputs.common-ref }}
        run: |
          podman pull "$REF"
          podman tag "$REF" localhost/molecule-base-common:latest

      - name: Pull data image
        if: contains(matrix.images, 'data')
        env:
          REF: ${{ needs.resolve-images.outputs.data-ref }}
        run: |
          podman pull "$REF"
          podman tag "$REF" localhost/molecule-base-data:latest

      - name: Pull infra image
        if: contains(matrix.images, 'infra')
        env:
          REF: ${{ needs.resolve-images.outputs.infra-ref }}
        run: |
          podman pull "$REF"
          podman tag "$REF" localhost/molecule-base-infra:latest

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install python tooling
        run: |
          uv pip install --system \
            ansible \
            "molecule==25.*" \
            "molecule-plugins[podman]==25.*" \
            cryptography \
            pytest

      - name: Cache Galaxy content
        id: galaxy-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.ansible/collections
            roles.galaxy
          key: galaxy-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      - name: Install Galaxy content
        if: steps.galaxy-cache.outputs.cache-hit != 'true'
        run: |
          ansible-galaxy collection install -r requirements.yml
          ansible-galaxy role install -r requirements.yml -p ./roles.galaxy

      # See bootstrap-scenarios for context on this workaround.
      - name: Unload host unix-chkpwd AppArmor profile
        run: sudo apparmor_parser -R /etc/apparmor.d/unix-chkpwd || true

      - name: molecule ${{ matrix.role }} (${{ matrix.scenario }})
        run: |
          cd tests/molecule/${{ matrix.role }}
          molecule test -s ${{ matrix.scenario }}
