---
name: lint
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install system tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils shellcheck

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node

        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install python tooling
        run: |
          uv pip install --system yamllint ansible-lint ruff ansible pyyaml pytest

      - name: Cache Galaxy content
        uses: actions/cache@v5
        with:
          path: |
            ~/.ansible/collections
            roles.galaxy
          key: galaxy-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      - name: Install Galaxy content
        run: |
          ansible-galaxy collection install -r requirements.yml
          ansible-galaxy role install -r requirements.yml -p ./roles.galaxy

      - name: Install markdownlint
        run: npm install -g markdownlint-cli2

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

      - name: pytest configure tests
        run: python -m pytest tests/configure -v

      - name: markdownlint
        run: markdownlint-cli2 "**/*.md" "#collections" "#.ansible" "#docs/superpowers"

      - name: xmllint firewalld services
        run: |
          shopt -s globstar nullglob
          files=(roles/**/files/*.xml)
          if (( ${#files[@]} )); then
            xmllint --noout "${files[@]}"
          fi
