---
# Operator entry: re-sync Patroni-managed role passwords from the vault.
#
#   ansible-playbook playbooks/rotate_passwords.yml
#   ansible-playbook playbooks/rotate_passwords.yml -e auto_confirm=true
#
# Patroni only sets the passwords for the superuser / replication / rewind
# roles at initdb time. If the vault values are rotated afterwards (e.g.
# `./configure` regenerated them, or an operator edited vault.yml), the
# rendered /etc/patroni/patroni.yml drifts from pg_authid and connections
# like pg_rewind fail with "password authentication failed".
#
# This playbook runs ALTER USER on the current leader for all three roles;
# the change replicates to standbys via WAL. Idempotent: running it twice
# is harmless.

- name: Rotate Patroni-managed role passwords
  hosts: postgres
  gather_facts: false
  become: true
  vars:
    auto_confirm: false
  tasks:
    - name: Locate the current leader
      ansible.builtin.include_role:
        name: cluster_ops
        tasks_from: find_leader.yml

    - name: Confirm the rotation
      ansible.builtin.pause:
        prompt: >-
          About to ALTER USER {{ patroni_superuser }}, {{ patroni_replication_user }},
          {{ patroni_rewind_user }} on leader {{ cluster_ops_leader_host }} to match
          the vault values. Press ENTER to proceed, Ctrl-C then A to abort.
      when: not (auto_confirm | bool)
      run_once: true

    - name: ALTER USER for Patroni-managed roles on the leader
      community.postgresql.postgresql_user:
        name: "{{ item.name }}"
        password: "{{ item.password }}"
        state: present
        login_unix_socket: "{{ provision_osdba_socket_dir | default('/var/run/postgresql') }}"
        login_user: "{{ provision_osdba | default(postgres_osdba | default('postgres')) }}"
        encrypted: true
      become: true
      become_user: "{{ provision_osdba | default(postgres_osdba | default('postgres')) }}"
      loop:
        - name: "{{ patroni_superuser }}"
          password: "{{ patroni_superuser_password }}"
        - name: "{{ patroni_replication_user }}"
          password: "{{ patroni_replication_password }}"
        - name: "{{ patroni_rewind_user }}"
          password: "{{ patroni_rewind_password }}"
      loop_control:
        label: "{{ item.name }}"
      delegate_to: "{{ cluster_ops_leader_host }}"
      run_once: true
      no_log: true

    - name: Report the result
      ansible.builtin.debug:
        msg: >-
          Rotated passwords for {{ patroni_superuser }},
          {{ patroni_replication_user }}, {{ patroni_rewind_user }} on
          leader {{ cluster_ops_leader_host }}. Standbys will pick up the
          change via replication.
      run_once: true
